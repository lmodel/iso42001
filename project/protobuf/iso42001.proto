  AimsRiskLevel aims_concern_severity = 7;
  // Who looked into it.
  string aims_concern_investigator = 8;
  // Where the inquiry stands, in the organization's own terms.
  string aims_concern_investigation_status = 9;
  // What the inquiry found.
  string aims_concern_findings = 10;
  // Whether and how it went up to management.
  string aims_concern_escalation = 11;
  // When an answer is due.
  string aims_concern_response_due = 12;
  // When it was answered.
  string aims_concern_responded_on = 13;
  // How it was settled.
  string aims_concern_resolution = 14;
  // What was done to shield those involved from reprisal.
  string aims_concern_reprisal_protection = 15;
  // The incidents it relates to.
  repeated AimsIncident aims_concern_incidents = 16;
  // The nonconformities it relates to.
  repeated AimsNonconformity aims_concern_nonconformities = 17;
  // The record's identifier, unique among the records of the system, such as a URI or a CURIE. Other records refer to the record by it.
  string aims_id = 18;
  // The name the organization gives the record.
  string title = 19;
  // What the record says or describes, in the organization's own words.
  string description = 20;
}
