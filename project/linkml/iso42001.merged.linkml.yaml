    "aims_duration": {
      "name": "aims_duration",
      "description": "A length of time as ISO 8601 writes it, such as P7Y for seven years or P30D for thirty days.",
      "comments": [
        "The pattern is that of xsd:duration, which has no weeks, so two weeks is P14D."
      ],
      "from_schema": "https://w3id.org/lmodel/iso42001",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:duration",
      "pattern": "^P(?=[0-9T])([0-9]+Y)?([0-9]+M)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$"
    },
