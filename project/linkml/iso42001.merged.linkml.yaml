        {
          "preconditions": {
            "slot_conditions": {
              "aims_finding_nonconformity": {
                "name": "aims_finding_nonconformity",
                "value_presence": "PRESENT"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "aims_finding_type": {
                "name": "aims_finding_type",
                "equals_string_in": [
                  "major_nonconformity",
                  "minor_nonconformity"
                ]
              }
            }
          },
          "description": "A finding that names a nonconformity record is a finding of a nonconformity."
        }
      ]
    },
