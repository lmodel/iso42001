  # ---------------------
  # Reference Control Slots (Annex A)
  # ---------------------

  reference_controls:
    description: AI reference controls applied within the AIMS.
    range: AIReferenceControl
    multivalued: true

  control_id:
    description: >-
      Control identifier from Annex A (e.g., A.6.2.4). Accepts either an
      enumerated normative `AnnexAControlId` value or a free-form string for
      organization-defined controls beyond Annex A.
    range: string
    pattern: "^A\\.[0-9]{1,2}(\\.[0-9]{1,2})*$"
    any_of:
      - range: AnnexAControlId
      - range: string
    comments:
      - Format matches Annex A numbering (A.<family>[.<subclause>][.<control>])
      - >-
        Use AnnexAControlId for the 38 normative Annex A controls; use string for org-defined
        controls.

  control_title:
    description: Title of the control.
    range: string

  control_family:
    description: Family of the Annex A control.
    range: AIControlFamily

  control_text:
    description: >-
      Organization-authored control statement or external control summary.
      Do not include verbatim ISO/IEC standards text.
    range: string

  implementation_guidance:
    description: Organization-authored implementation notes for the control.
    range: string

  related_controls:
    description: Other reference controls related to this one.
    range: AIReferenceControl
    multivalued: true

  applicable_risk_sources:
    description: Categories of AI risk source this control addresses.
    range: AIRiskSourceCategory
    multivalued: true

  applicable_objectives:
    description: AI objective categories this control supports.
    range: AIObjectiveCategory
    multivalued: true

  control_owner:
    description: Person responsible for the control.
    range: string

  implementation_date:
    description: Date the control was implemented.
    range: date

  effectiveness_rating:
    description: Rating of control effectiveness.
    range: string

  last_test_date:
    description: Date the control was last tested.
    range: date

  evidence_references:
    description: References to evidence of implementation.
    range: string
    multivalued: true

