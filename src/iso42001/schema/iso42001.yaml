      - expected_benefit
      - priority
      - implementation_plan
      - responsible_party
      - target_date
      - actual_completion_date
      - outcome_assessment
      - status

    # ---------------------
    # Third-Party and Customer Relationships (Annex A.10)
    # ---------------------

    exact_mappings:
      - iso27001:ImprovementOpportunity
  ThirdPartyRelationship:
    is_a: NamedEntity
    description: >-
      A documented relationship with a third party (supplier, partner, or
      customer) involved in the AI system life cycle per A.10.
    comments:
      - Documented relationship per Annex A.10 capturing responsibility allocation
      - Specialized into SupplierRelationship and CustomerRelationship
    in_subset:
      - third_party_management
    annotations:
      annex_a_reference: "A.10"
    slots:
      - party_type
      - party_name
      - contractual_basis
      - allocated_responsibilities
      - data_processing_role
      - ai_systems_involved
      - lifecycle_stages_involved
      - assurance_evidence
      - review_frequency

    related_mappings:
      - iso27001:InterestedParty
  SupplierRelationship:
    is_a: ThirdPartyRelationship
    description: >-
      A supplier relationship covering services, products, or materials
      (e.g., datasets, models, libraries, full AI systems) provided to
      the organization per A.10.3.
    comments:
      - Supplier relationship per Annex A.10.3
      - Includes assessment criteria, monitoring method, and corrective actions required
    in_subset:
      - third_party_management
    annotations:
      annex_a_reference: "A.10.3"
    slots:
      - supplier_assessment_criteria
      - monitoring_method
      - corrective_actions_required

    related_mappings:
      - iso27001:InterestedParty
  CustomerRelationship:
    is_a: ThirdPartyRelationship
    description: >-
      A customer relationship for an AI product or service supplied by the
      organization per A.10.4.
    comments:
      - Customer relationship per Annex A.10.4
      - Captures customer expectations and communicated AI system limitations
    in_subset:
      - third_party_management
    annotations:
      annex_a_reference: "A.10.4"
    slots:
      - customer_expectations
      - usage_agreement_reference
      - communicated_limitations

    # ---------------------
    # Incident Management (Annex A.8.3 / A.8.4)
    # ---------------------

    related_mappings:
      - iso27001:InterestedParty
  AISystemEvent:
    is_a: NamedEntity
    description: >-
      An AI system event detected by monitoring, users, or external
      reporting channels. Events may or may not be subsequently classified
      as incidents. Supports A.6.2.8 event log capture and A.8.3 external
      reporting workflows.
    in_subset:
      - performance_evaluation
      - annex_a_controls
    comments:
      - First-class entity allowing event records to attach to A.6.2.8 logs and A.8.3 reports
      - >-
        Reference: ISO/IEC 42001:2023 Annex A controls A.6.2.8, A.8.3. ISO/IEC standards text is
        copyright ISO/IEC - not reproduced here.
    annotations:
      annex_a_reference: "A.6.2.8, A.8.3"
    slots:
      - event_datetime
      - reporter
      - reporter_party_type
      - event_source
      - event_description
      - affected_ai_systems
      - initial_assessment
      - categorized_as_incident
      - linked_incident

    close_mappings:
      - iso27001:InformationSecurityEvent
  AIIncident:
    is_a: NamedEntity
    description: >-
      An AI incident, i.e., an AI system event determined to require
      response, escalation, or external communication. Captures triage,
      response lifecycle, and communications to users and other interested
      parties per A.8.4 and A.8.3.
    in_subset:
      - performance_evaluation
      - annex_a_controls
      - continual_improvement
    comments:
      - Provides the entity to which A.8.4 communication plans and A.8.3 external reports attach
      - >-
        AI-specific categories (data poisoning, model stealing, prompt injection, etc.) supplement
        classical infosec incident classes
      - >-
        Reference: ISO/IEC 42001:2023 Annex A controls A.8.3, A.8.4. ISO/IEC standards text is
        copyright ISO/IEC - not reproduced here.
    annotations:
      annex_a_reference: "A.8.3, A.8.4"
    slots:
      - incident_datetime
      - incident_category
      - severity
      - affected_ai_systems
      - affected_dimensions
      - incident_description
      - detection_method
      - response_actions
      - containment_actions
      - recovery_actions
      - root_cause
      - lessons_learned
      - evidence_collected
      - notification_required
      - notifications_made
      - external_reports
      - communication_plan
      - linked_corrective_actions
      - closure_datetime
      - post_incident_review

    close_mappings:
      - iso27001:InformationSecurityIncident
      - iso29100:PrivacyBreach
      - nist_ai_100_1:Harm
      - nist_ai_600_1:GaiRisk
  ConcernReport:
    is_a: NamedEntity
    description: >-
      A concern raised by employees, contractors, users, or other
      interested parties about the organization's role with respect to an
      AI system. Operationalises Annex A.3.3 (Reporting of concerns).
      Confidentiality, anonymity, anti-reprisal protection, escalation,
      and timely response are core attributes; informed by ISO 37002.
    in_subset:
      - annex_a_controls
      - performance_evaluation
    comments:
      - First-class entity supporting A.3.3 concern-reporting workflows distinct from AIIncident
      - Anonymity and anti-reprisal protections are required even when reporter identity is captured
      - >-
        Reference: ISO/IEC 42001:2023 Annex A.3.3 (paraphrased); related guidance ISO 37002. ISO
        standards text is copyright ISO/IEC - not reproduced here.
    annotations:
      annex_a_reference: "A.3.3"
    slots:
      - reported_date
      - reporter
      - reporter_party_type
      - reporter_anonymous
      - confidentiality_level
      - reporting_channel
      - concern_description
      - concern_ai_systems
      - concern_lifecycle_stage
      - severity
      - investigator
      - investigation_status
      - investigation_findings
      - escalation_status
      - response_due_date
      - response_provided_date
      - resolution
      - reprisal_protection_actions
      - related_incidents
      - related_nonconformities
      - closure_datetime

    # ==============================================================================
    # SLOTS
    # ==============================================================================

    related_mappings:
      - iso27001:Nonconformity
      - nist_ai_100_1:Harm
      - nist_ai_600_1:StructuredPublicFeedback
slots:
  # ---------------------
  # Common Identification Slots
  # ---------------------

  id:
    description: Unique identifier for the entity.
    range: uriorcurie
    identifier: true
    required: true
    examples:
      - value: "iso42001:ai-risk-001"
      - value: "iso42001:control-A.6.2.4"

    exact_mappings:
      - iso27001:id
  name:
    description: Human-readable name or title.
    range: string
    required: true

    exact_mappings:
      - iso27001:name
  description:
    description: Detailed description of the entity.
    range: string

    exact_mappings:
      - iso27001:description
  version:
    description: Version identifier for the entity.
    range: string
    examples:
      - value: "1.0"
      - value: "2.3.1"

    exact_mappings:
      - iso27001:version
  created_date:
    description: Date when the entity was created.
    range: date

  modified_date:
    description: Date when the entity was last modified.
    range: date

  # ---------------------
  # Document Control Slots (Clause 7.5)
  # ---------------------

  document_type:
    description: Classification of the documented information.
    range: DocumentType
    in_subset:
      - documented_information

  document_reference:
    description: Unique reference number for document control.
    range: string
    examples:
      - value: "AIMS-POL-001"
      - value: "AISIA-2025-003"

  author:
    description: Person who created the document.
    range: string

  owner:
    description: Person accountable for the document content and maintenance.
    range: string

  approved_by:
    description: Person who approved the document.
    range: string

  approved_date:
    description: Date when the document was approved.
    range: date

  effective_date:
    description: Date when the document becomes effective.
    range: date

  review_date:
    description: Date when the document is due for review.
    range: date

  status:
    description: Current status of the document or entity.
    range: string
    comments:
      - Examples include draft, approved, active, superseded, archived

  classification:
    description: Information classification level.
    range: string
    examples:
      - value: "confidential"
      - value: "internal"
      - value: "public"

  retention_period:
    description: Duration for which the document is retained.
    range: duration type
    comments:
      - Use ISO 8601 duration notation such as P1Y or P90D

  # ---------------------
  # Organization and Context Slots (Clause 4)
  # ---------------------

  organization:
    description: Reference to the organization operating the AIMS.
    range: Organization

    exact_mappings:
      - iso27001:organization
  legal_name:
    description: Legal registered name of the organization.
    range: string

  trading_names:
    description: Names under which the organization conducts business.
    range: string
    multivalued: true

  organization_type:
    description: Type of organization (e.g., corporation, government, nonprofit).
    range: string

  industry_sector:
    description: Primary industry sector of the organization (free-form label).
    range: string
    examples:
      - value: "Financial Services"
      - value: "Healthcare"
      - value: "Public Sector"

  sector_domains:
    description: >-
      Application sectors in which the organization deploys AI systems,
      drawn from the Annex D examples; supports identification of sector-
      specific management system standards that integrate with the AIMS.
    range: SectorDomain
    multivalued: true
    annotations:
      iso42001_clause: "Annex D"

  size_category:
    description: Organization size classification.
    range: string
    examples:
      - value: "SME"
      - value: "Enterprise"

  employee_count:
    description: Approximate number of employees.
    range: positive integer type

  geographic_locations:
    description: Countries or regions where the organization operates.
    range: string
    multivalued: true

  regulatory_jurisdictions:
    description: Jurisdictions whose regulations apply to the organization.
    range: string
    multivalued: true

  parent_organization:
    description: Parent organization if applicable.
    range: string

  subsidiaries:
    description: Subsidiary organizations if applicable.
    range: string
    multivalued: true

  ai_roles:
    description: >-
      Roles the organization takes with respect to AI systems
      (provider, producer, customer, partner, subject, authority).
    range: AIOrganizationalRole
    multivalued: true
    annotations:
      iso42001_clause: "4.1"

    close_mappings:
      - iso27001:roles
  organizational_roles_with_ai:
    description: >-
      Documented set of roles the organization plays in the AI ecosystem
      within the AIMS scope.
    range: AIOrganizationalRole
    multivalued: true

  scope_statement:
    description: Documented statement of AIMS scope per Clause 4.3.
    range: string
    annotations:
      iso42001_clause: "4.3"

    exact_mappings:
      - iso27001:scope_statement
  scope_boundaries:
    description: Defined boundaries of the AIMS scope.
    range: string
    multivalued: true

    exact_mappings:
      - iso27001:scope_boundaries
  scope_exclusions:
    description: Any exclusions from scope with justification.
    range: string
    multivalued: true

    exact_mappings:
      - iso27001:scope_exclusions
  context_internal_issues:
    description: Internal issues relevant to the AIMS per Clause 4.1.
    range: string
    multivalued: true

    exact_mappings:
      - iso27001:context_internal_issues
  context_external_issues:
    description: External issues relevant to the AIMS per Clause 4.1.
    range: string
    multivalued: true

    exact_mappings:
      - iso27001:context_external_issues
  climate_change_relevant:
    description: >-
      Whether climate change has been determined to be a relevant issue
      for the organization's context per Clause 4.1.
    range: boolean
    annotations:
      iso42001_clause: "4.1"

    exact_mappings:
      - iso27001:climate_change_relevant
  interested_parties:
    description: Stakeholders relevant to the AIMS.
    range: InterestedParty
    multivalued: true
    annotations:
      iso42001_clause: "4.2"

    exact_mappings:
      - iso27001:interested_parties
  party_type:
    description: Category of party.
    range: string
    examples:
      - value: "internal"
      - value: "external"
      - value: "regulatory"
      - value: "ai_subject"
      - value: "supplier"
      - value: "customer"

  relationship:
    description: Nature of the relationship with the organization.
    range: string

  requirements:
    description: Requirements of the interested party.
    range: string
    multivalued: true

  communication_needs:
    description: Communication requirements for this party.
    range: string

  contact_information:
    description: Contact details for the party.
    range: string

  # ---------------------
  # Policy Slots (Clause 5.2)
  # ---------------------

  ai_policy:
    description: Reference to the AI policy.
    range: AIPolicy
    annotations:
      iso42001_clause: "5.2"

    close_mappings:
      - iso27001:information_security_policy
  policy_statement:
    description: The core policy statement text.
    range: string

  policy_objectives_framework:
    description: Framework for setting AI objectives.
    range: string

  commitment_statements:
    description: Statements of commitment included in the policy.
    range: string
    multivalued: true

  applicability_statement:
    description: Statement of policy applicability.
    range: string

  communication_date:
    description: Date when the policy was communicated.
    range: date

  acknowledgment_required:
    description: Whether acknowledgment is required from personnel.
    range: boolean

  related_topic_policies:
    description: Topic-specific policies supporting this policy.
    range: TopicSpecificPolicy
    multivalued: true

    exact_mappings:
      - iso27001:related_topic_policies
  last_policy_review_date:
    description: Date of the most recent AI policy review.
    range: date
    annotations:
      annex_a_reference: "A.2.4"

    exact_mappings:
      - iso27001:last_policy_review_date
  next_policy_review_date:
    description: Planned date of the next AI policy review.
    range: date
    annotations:
      annex_a_reference: "A.2.4"

    exact_mappings:
      - iso27001:next_policy_review_date
  topic_area:
    description: The specific topic addressed by the policy.
    range: string
    examples:
      - value: "Data Governance"
      - value: "Human Oversight"
      - value: "Model Validation"
      - value: "Transparency"

  parent_policy:
    description: The parent AI policy this topic-specific policy supports.
    range: AIPolicy

  applicable_controls:
    description: Reference controls related to this policy or AI system.
    range: AIReferenceControl
    multivalued: true

  target_audience:
    description: Intended audience for the policy or document.
    range: string

  # ---------------------
  # Role Slots (Clause 5.3 / A.3.2)
  # ---------------------

  roles:
    description: AI-related roles defined in the AIMS.
    range: Role
    multivalued: true

  role_type:
    description: >-
      Category of the role. Use a `GovernanceRoleType` value for the
      normative AIMS governance positions; free-form strings remain
      accepted for organization-defined roles.
    range: string
    any_of:
      - range: GovernanceRoleType
      - range: string
    examples:
      - value: "top_management"
      - value: "governing_body"
      - value: "ai_risk_owner"
      - value: "Chief AI Officer"
      - value: "Model Validator"

  responsibilities:
    description: Responsibilities assigned to the role.
    range: string
    multivalued: true

  authorities:
    description: Authorities granted to the role.
    range: string
    multivalued: true

  accountability:
    description: What the role is accountable for.
    range: string

    exact_mappings:
      - iso29100:accountability
    close_mappings:
      - nist_ai_100_1:TrustworthinessCharacteristic
  assigned_to:
    description: Person(s) assigned to this role or resource.
    range: string
    multivalued: true

  delegation_rules:
    description: Rules for delegating responsibilities.
    range: string

  reporting_line:
    description: To whom this role reports.
    range: string

  # ---------------------
  # Objective Slots (Clause 6.2)
  # ---------------------

  ai_objectives:
    description: AI objectives established by the organization.
    range: AIObjective
    multivalued: true

    close_mappings:
      - iso27001:objectives
  objective_statement:
    description: Clear statement of the objective.
    range: string

  objective_category:
    description: >-
      Category of AI objective (e.g., fairness, transparency, robustness).
    range: AIObjectiveCategory

  target_value:
    description: Target value for the objective metric.
    range: string

  current_value:
    description: Current measured value.
    range: string

  metric_definition:
    description: Definition of how the objective is measured.
    range: string

  measurement_method:
    description: Method used to measure the metric.
    range: string

  measurement_frequency:
    description: How often measurement is performed.
    range: string

  responsible_role:
    description: Role responsible for the objective or control.
    range: Role

  target_date:
    description: Target date for achieving the objective.
    range: date

  achievement_status:
    description: Current status of objective achievement.
    range: string

  action_plan:
    description: Plan for achieving the objective.
    range: string

  # ---------------------
  # AI Risk Assessment Slots (Clause 6.1.2)
  # ---------------------

  ai_risk_assessment_process:
    description: Reference to the AI risk assessment process.
    range: AIRiskAssessmentProcess

    close_mappings:
      - iso27001:risk_assessment_process
  alignment_with_ai_policy:
    description: Statement of how the process aligns with the AI policy.
    range: string
    annotations:
      iso42001_clause: "6.1.2 a)"

  risk_acceptance_criteria:
    description: Criteria for accepting AI risks.
    range: string
    annotations:
      iso42001_clause: "6.1.1"

  assessment_criteria:
    description: Criteria for performing AI risk or impact assessments.
    range: string

  assessment_methodology:
    description: Methodology used for assessment.
    range: string

  likelihood_scale:
    description: Scale used for likelihood rating.
    range: string

  impact_scale:
    description: Scale used for impact rating.
    range: string

  risk_matrix:
    description: Risk matrix or calculation method.
    range: string

  assessment_frequency:
    description: Planned frequency of assessments.
    range: string

  trigger_events:
    description: Events that trigger an assessment outside the planned schedule.
    range: string
    multivalued: true
    comments:
      - Per 8.2 / 8.4 when significant changes are proposed or occur

  ai_risk_assessments:
    description: AI risk assessment instances.
    range: AIRiskAssessment
    multivalued: true

    close_mappings:
      - iso27001:risk_assessments
  assessment_scope:
    description: Scope of the assessment.
    range: string

  ai_systems_assessed:
    description: AI systems covered by this assessment.
    range: AISystem
    multivalued: true

  assessment_date:
    description: Date the assessment was conducted.
    range: date

  assessor:
    description: Person or team who conducted the assessment.
    range: string

  methodology_used:
    description: Specific methodology applied in this assessment.
    range: string

  risks_identified:
    description: Risks identified in this assessment.
    range: AIRisk
    multivalued: true

    close_mappings:
      - iso29100:privacy_risks
      - nist_ai_100_1:risks
  linked_impact_assessment:
    description: AI system impact assessment linked to this risk assessment.
    range: AISystemImpactAssessment

  summary_findings:
    description: Summary of assessment findings.
    range: string

  recommendations:
    description: Recommendations from the assessment.
    range: string
    multivalued: true

  next_assessment_date:
    description: Planned date for next assessment.
    range: date

  # ---------------------
  # AI Risk Slots
  # ---------------------

  related_risks:
    description: Associated AI risks.
    range: AIRisk
    multivalued: true

  risk_source_category:
    description: Category of AI risk source per Annex C.
    range: AIRiskSourceCategory

  risk_source_description:
    description: Description of the specific source of risk.
    range: string

  affected_ai_systems:
    description: AI systems affected by this risk.
    range: AISystem
    multivalued: true

    close_mappings:
      - iso27001:affected_assets
    related_mappings:
      - nist_ai_600_1:risk_scope
  affected_dimensions:
    description: >-
      Dimensions of impact affected by the risk (individual, group,
      societal, safety, privacy, security, environmental).
    range: ImpactAssessmentDimension
    multivalued: true

  risk_owner:
    description: Person accountable for managing the AI risk.
    range: string
    annotations:
      iso42001_clause: "6.1.2"

    close_mappings:
      - iso29100:pii_controller
  likelihood:
    description: Assessed likelihood of risk occurrence.
    range: LikelihoodRating
    annotations:
      iso42001_clause: "6.1.2 d) 2)"

  impact:
    description: Assessed consequence if the risk materializes.
    range: ImpactRating
    annotations:
      iso42001_clause: "6.1.2 d) 1)"

  inherent_risk_level:
    description: Risk level before controls are applied.
    range: RiskLevel

  existing_controls:
    description: Controls currently in place affecting this risk.
    range: AIReferenceControl
    multivalued: true

  residual_risk_level:
    description: Risk level after controls are applied.
    range: RiskLevel

  risk_treatment_option:
    description: Selected treatment option for the AI risk.
    range: RiskTreatmentOption

    close_mappings:
      - nist_ai_100_1:risk_response
  treatment_priority:
    description: Priority for treating this risk.
    range: string

  related_treatment_plan:
    description: Risk treatment plan addressing this risk.
    range: AIRiskTreatmentPlan

  related_impact_assessment:
    description: AI system impact assessment associated with this risk.
    range: AISystemImpactAssessment

  # ---------------------
  # AI Risk Treatment Slots (Clause 6.1.3)
  # ---------------------

  ai_risk_treatment_process:
    description: Reference to the AI risk treatment process.
    range: AIRiskTreatmentProcess

    close_mappings:
      - iso27001:risk_treatment_process
  treatment_options_guidance:
    description: Guidance on selecting AI risk treatment options.
    range: string

  control_selection_criteria:
    description: Criteria for selecting Annex A controls.
    range: string

  soa_template:
    description: Template used for the Statement of Applicability.
    range: string

  approval_workflow:
    description: Workflow for approving AI risk treatment.
    range: string

  ai_risk_treatment_plans:
    description: AI risk treatment plans.
    range: AIRiskTreatmentPlan
    multivalued: true

    close_mappings:
      - iso27001:risk_treatment_plans
  plan_scope:
    description: Scope of the treatment plan.
    range: string

  risks_addressed:
    description: Risks addressed by this plan.
    range: AIRisk
    multivalued: true

  treatment_actions:
    description: Actions to be taken for treatment.
    range: string
    multivalued: true

  controls_to_implement:
    description: Controls to be implemented as part of treatment.
    range: AIReferenceControl
    multivalued: true

  resources_required:
    description: Resources required for implementation.
    range: string

  responsible_parties:
    description: Parties responsible for implementation.
    range: string
    multivalued: true

  implementation_timeline:
    description: Timeline for implementation.
    range: string

  risk_owner_approval:
    description: Risk owner who approved the plan.
    range: string
    annotations:
      iso42001_clause: "6.1.3"

  residual_risk_acceptance:
    description: Documentation of residual AI risk acceptance.
    range: string
    annotations:
      iso42001_clause: "6.1.3"

    close_mappings:
      - nist_ai_100_1:residual_risk
  implementation_status:
    description: Current implementation status.
    range: ImplementationStatus

  completion_date:
    description: Date when implementation was completed.
    range: date

  # ---------------------
  # AI System Impact Assessment Slots (Clause 6.1.4 / A.5)
  # ---------------------

  ai_system_impact_assessment_process:
    description: Reference to the AI system impact assessment process.
    range: AISystemImpactAssessmentProcess

  ai_system_impact_assessments:
    description: AI system impact assessment instances.
    range: AISystemImpactAssessment
    multivalued: true

  dimensions_in_scope:
    description: Impact dimensions evaluated by the process.
    range: ImpactAssessmentDimension
    multivalued: true

  linkage_to_risk_assessment:
    description: >-
      Description of how impact assessment results feed into AI risk
      assessment per Clause 6.1.4.
    range: string

  technical_context:
    description: Specific technical context in which the AI system is deployed.
    range: string

  societal_context:
    description: Societal context relevant to the impact assessment.
    range: string

  applicable_jurisdictions:
    description: Jurisdictions relevant to the assessment.
    range: string
    multivalued: true

  dimensions_assessed:
    description: Impact dimensions actually assessed in this instance.
    range: ImpactAssessmentDimension
    multivalued: true

  identified_consequences:
    description: Identified positive or negative consequences.
    range: string
    multivalued: true

  mitigations:
    description: Mitigations to address identified consequences.
    range: string
    multivalued: true

  shared_with_parties:
    description: Interested parties with whom the results have been shared.
    range: string
    multivalued: true

  # ---------------------
  # Statement of Applicability Slots
  # ---------------------

