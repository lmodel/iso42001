# ==============================================================================
# ISO/IEC 42001:2023 aligned AI Management System Schema
# ==============================================================================
# This LinkML schema provides a machine-readable, validatable representation of
# AI Management System (AIMS) entities and relationships aligned with ISO/IEC
# 42001:2023 clause and Annex references.
#
# Intended use cases:
#   - Publishing open AI governance data (e.g., Statements of Applicability,
#     AI system impact assessments)
#   - Automating audit evidence collection and gap analysis
#   - Integrating AIMS data with GRC, AI governance, and MLOps platforms
#   - Generating RDF/JSON-LD for linked data interoperability with adjacent
#     management systems (ISO/IEC 27001, ISO/IEC 27701, ISO 9001)
#
# Schema version aligns with ISO/IEC 42001:2023 (First edition, 2023-12).
#
# IMPORTANT: All descriptive text in this schema is original/paraphrased.
# The ISO/IEC 42001:2023 standards text is copyright ISO/IEC and is NOT
# reproduced verbatim here.
# ==============================================================================

id: https://w3id.org/lmodel/iso42001
name: iso42001
title: "ISO 42001 / AIMS: LinkML Schema"
description: >-
  A comprehensive LinkML schema modeling AI Management System (AIMS) entities,
  workflows, and traceability links aligned to ISO/IEC 42001:2023 clause and
  Annex references. Designed for open data publication, automated validation,
  and integration with AI governance, risk, and compliance platforms.

  This schema captures:
  - AIMS lifecycle (establish, implement, maintain, improve)
  - AI risk assessment, treatment, and AI system impact assessment (Clause 6.1)
  - Annex A reference control catalog (A.2-A.10) for responsible AI
  - Audit, measurement, and continual improvement artifacts
  - Data resources, tooling, computing, and human resources for AI systems
  - Third-party, supplier, and customer relationships across the AI life cycle

license: https://www.apache.org/licenses/LICENSE-2.0
version: 1.0.0

see_also:
  - https://lmodel.github.io/iso42001
  - https://www.iso.org/standard/81230.html

# -----------------------
# Schema-level Annotations
# -----------------------
annotations:
  standard_reference: ISO/IEC 42001:2023(E)
  standard_title: >-
    Information technology - Artificial intelligence - Management system
  standard_edition: First edition
  standard_date: 2023-12
  developing_committee: ISO/IEC JTC 1/SC 42 (Artificial Intelligence)
  normative_reference: ISO/IEC 22989:2022 (AI concepts and terminology)
  related_standards: >-
    ISO/IEC 23894 (AI risk management guidance);
    ISO/IEC 38507 (Governance of IT - AI governance implications);
    ISO/IEC 5259 (Data quality for analytics and ML);
    ISO/IEC 5338 (AI system life cycle process);
    ISO/IEC 27001 (Information security management);
    ISO/IEC 27701 (Privacy information management);
    ISO 9001 (Quality management);
    ISO 31000 (Risk management)
  harmonized_structure: true
  rights_notice: >-
    This project is licensed under Apache-2.0 for original schema structure and
    descriptions. ISO/IEC standards text is owned by ISO/IEC and is not
    reproduced verbatim by this project.
  schema_maintainer: noel.mcloughlin@gmail.com
  schema_status: stable
  amendment_reference: >-
    Forward-compatibility placeholder for tracking amendments (AMD) and
    technical corrigenda (Cor) to ISO/IEC 42001:2023. Update when ISO/IEC
    publishes amendments to the base edition.

# -----------------------
# Prefix Declarations
# -----------------------
prefixes:
  linkml: https://w3id.org/linkml/
  iso42001: https://w3id.org/lmodel/iso42001/
  iso27001: https://w3id.org/lmodel/iso27001/
  iso22989: https://w3id.org/lmodel/iso22989/
  iso23894: https://w3id.org/lmodel/iso23894/
  iso29100: https://w3id.org/lmodel/iso29100/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  skos: "http://www.w3.org/2004/02/skos/core#"
  prov: "http://www.w3.org/ns/prov#"
  nist_ai_rmf: https://www.nist.gov/itl/ai-risk-management-framework/
  nist_ai_100_1: https://w3id.org/lmodel/nist-ai-100-1/
  nist_ai_600_1: https://w3id.org/lmodel/nist-ai-600-1/

default_prefix: iso42001
default_range: string

# -----------------------
# Imports
# -----------------------
imports:
  - linkml:types

# ----------------------
# Types
# ----------------------
types:
  positive integer type:
    base: int
    uri: xsd:positiveInteger
    description: >-
      integer greater than zero; natural number explicitly excluding zero
    exact_mappings:
      - wikidata:Q28920044

  unsigned short type:
    base: int
    uri: xsd:unsignedShort
    description: >-
      data type for non-negative integers that can be represented with 16 bits
    exact_mappings:
      - wikidata:Q110650833

  duration type:
    base: str
    uri: xsd:duration
    description: >-
      ISO 8601 duration value such as P1Y, P30D, or PT4H

# -----------------------
# Subsets
# -----------------------
subsets:
  aims_core:
    description: >-
      Core AIMS structural elements required for conformity with Clauses 4-10
      of ISO/IEC 42001:2023. These classes represent the minimum viable data
      model for AIMS documentation.
    comments:
      - Mandatory for any ISO/IEC 42001 conformance dataset
      - Maps to requirement statements in the standard

  annex_a_controls:
    description: >-
      Classes and enumerations representing the reference controls in
      Annex A of ISO/IEC 42001:2023, grouped into nine control families
      (A.2 through A.10). Implementation guidance is provided in Annex B.

  ai_risk_management:
    description: >-
      Elements supporting AI risk assessment (6.1.2), AI risk treatment
      (6.1.3), and AI system impact assessment (6.1.4). Aligned with
      ISO 31000:2018 and ISO/IEC 23894 guidance.

  ai_system_lifecycle:
    description: >-
      Classes representing the AI system life cycle stages (design,
      development, verification, deployment, operation, monitoring,
      decommissioning) referenced in Annex A.6.

  ai_data_management:
    description: >-
      Elements covering data resources, data acquisition, data quality,
      data provenance, and data preparation for AI systems per A.7.

  performance_evaluation:
    description: >-
      Classes for monitoring, measurement, internal audit, and management
      review per Clauses 9.1-9.3.

  continual_improvement:
    description: >-
      Elements for nonconformity management, corrective actions, and
      improvement tracking per Clause 10.

  documented_information:
    description: >-
      Classes representing required documented information per Clause 7.5.
      Supports document control and retention requirements.

  third_party_management:
    description: >-
      Classes covering allocation of responsibilities to partners, suppliers,
      and customers across the AI system life cycle per A.10.

# ==============================================================================
# ENUMERATIONS
# ==============================================================================

enums:
  AIControlFamily:
    description: >-
      The reference control families in Annex A of ISO/IEC 42001:2023.
    in_subset:
      - annex_a_controls
    permissible_values:
      ai_policies:
        description: >-
          Policies related to AI (Annex A.2) - management direction and
          support for AI systems according to business requirements.
        annotations:
          annex_clause: "A.2"
      internal_organization:
        description: >-
          Internal organization (Annex A.3) - accountability for responsible
          implementation, operation, and management of AI systems.
        annotations:
          annex_clause: "A.3"
      ai_resources:
        description: >-
          Resources for AI systems (Annex A.4) - documentation of data,
          tooling, system/computing, and human resources for AI systems.
        annotations:
          annex_clause: "A.4"
      impact_assessment:
        description: >-
          Assessing impacts of AI systems (Annex A.5) - evaluation of
          consequences for individuals, groups, and societies across the
          AI system life cycle.
        annotations:
          annex_clause: "A.5"
      ai_system_lifecycle:
        description: >-
          AI system life cycle (Annex A.6) - responsible design, development,
          verification, deployment, operation, and technical documentation.
        annotations:
          annex_clause: "A.6"
      data_for_ai:
        description: >-
          Data for AI systems (Annex A.7) - data management, acquisition,
          quality, provenance, and preparation for AI.
        annotations:
          annex_clause: "A.7"
      information_for_parties:
        description: >-
          Information for interested parties (Annex A.8) - system
          documentation for users, external reporting, and incident
          communications.
        annotations:
          annex_clause: "A.8"
      use_of_ai:
        description: >-
          Use of AI systems (Annex A.9) - responsible-use processes,
          objectives, and intended-use enforcement.
        annotations:
          annex_clause: "A.9"
      third_party_relationships:
        description: >-
          Third-party and customer relationships (Annex A.10) - allocating
          responsibilities, supplier management, and customer expectations.
        annotations:
          annex_clause: "A.10"

  ImplementationStatus:
    description: >-
      Lifecycle status of a reference control, used in the AIMS Statement
      of Applicability and control tracking.
    in_subset:
      - annex_a_controls
    permissible_values:
      not_started:
        description: Control identified but no implementation activities begun.
      planned:
        description: Control scheduled for implementation with defined timeline.
      in_progress:
        description: Implementation actively underway but not yet complete.
      implemented:
        description: Control fully implemented and operational.
      not_applicable:
        description: >-
          Control excluded from scope with documented justification per
          Clause 6.1.3 f).

    exact_mappings:
      - iso27001:ImplementationStatus
  RiskTreatmentOption:
    description: >-
      Standard risk treatment options drawn from ISO 31000 and adapted for
      AI risk treatment per Clause 6.1.3.
    in_subset:
      - ai_risk_management
    permissible_values:
      modify:
        description: >-
          Apply controls to change the AI risk level (reduce likelihood or
          consequence).
        aliases:
          - mitigate
          - reduce
        exact_mappings:
          - nist_ai_100_1:MITIGATING
      accept:
        description: >-
          Accept the residual AI risk without further treatment, within risk
          appetite, with designated management approval.
        aliases:
          - retain
        exact_mappings:
          - nist_ai_100_1:ACCEPTING
      avoid:
        description: >-
          Eliminate the AI risk by not undertaking the activity that creates
          it (for example, not deploying a high-risk AI use case).
        aliases:
          - terminate
        exact_mappings:
          - nist_ai_100_1:AVOIDING
      share:
        description: >-
          Transfer or share the AI risk with external parties (e.g., insurance,
          contractual transfer to a supplier or partner).
        aliases:
          - transfer

        exact_mappings:
          - nist_ai_100_1:TRANSFERRING
    exact_mappings:
      - iso27001:RiskTreatmentOption
      - nist_ai_100_1:RiskResponseEnum
  RiskLevel:
    description: >-
      Qualitative AI risk rating derived from likelihood and consequence
      analysis.
    in_subset:
      - ai_risk_management
    permissible_values:
      very_low:
        description: Negligible AI risk requiring no immediate action.
      low:
        description: Minor AI risk manageable through routine procedures.
      medium:
        description: >-
          Moderate AI risk requiring management attention and planned controls.
      high:
        description: >-
          Significant AI risk requiring priority treatment and escalation.
      critical:
        description: >-
          Severe AI risk threatening organizational objectives, individuals,
          or societies; requires immediate executive action.

    exact_mappings:
      - iso27001:RiskLevel
  LikelihoodRating:
    description: Qualitative likelihood scale for AI risk assessment.
    in_subset:
      - ai_risk_management
    permissible_values:
      rare:
        description: Highly unlikely to occur (< 5% probability).
        annotations:
          numeric_value: "1"
      unlikely:
        description: Not expected but possible (5-20% probability).
        annotations:
          numeric_value: "2"
      possible:
        description: May occur at some point (20-50% probability).
        annotations:
          numeric_value: "3"
      likely:
        description: Probably will occur (50-80% probability).
        annotations:
          numeric_value: "4"
      almost_certain:
        description: Expected to occur in most circumstances (> 80% probability).
        annotations:
          numeric_value: "5"

    exact_mappings:
      - iso27001:LikelihoodRating
  ImpactRating:
    description: >-
      Qualitative consequence scale for AI risk assessment, covering impact
      on the organization, individuals, groups, and societies.
    in_subset:
      - ai_risk_management
    permissible_values:
      negligible:
        description: No significant impact on operations, individuals, or society.
        annotations:
          numeric_value: "1"
      minor:
        description: Limited impact, easily absorbed by normal operations.
        annotations:
          numeric_value: "2"
      moderate:
        description: Noticeable impact requiring management intervention.
        annotations:
          numeric_value: "3"
      major:
        description: >-
          Serious impact on objectives, reputation, compliance, or
          identifiable groups of individuals.
        annotations:
          numeric_value: "4"
      severe:
        description: >-
          Catastrophic impact threatening organizational viability, broad
          societal harm, or fundamental rights of affected individuals.
        annotations:
          numeric_value: "5"

    exact_mappings:
      - iso27001:ImpactRating
  AISystemLifecycleStage:
    description: >-
      Stages of the AI system life cycle referenced throughout Annex A.6 and
      defined in ISO/IEC 5338 / ISO/IEC 22989.
    in_subset:
      - ai_system_lifecycle
    permissible_values:
      inception:
        description: Initial conception, feasibility, and use-case definition.
        close_mappings:
          - nist_ai_100_1:PLAN_AND_DESIGN
      design:
        description: AI system design including requirements and architecture.
        exact_mappings:
          - nist_ai_100_1:PLAN_AND_DESIGN
          - nist_ai_600_1:DESIGN
      data_collection_and_preparation:
        description: Acquiring, labelling, and preparing data resources.
        exact_mappings:
          - nist_ai_100_1:COLLECT_AND_PROCESS_DATA
      development:
        description: Model and AI system development and training.
        exact_mappings:
          - nist_ai_100_1:BUILD_AND_USE_MODEL
          - nist_ai_600_1:DEVELOPMENT
      verification_and_validation:
        description: Verification and validation of the AI system.
        exact_mappings:
          - nist_ai_100_1:VERIFY_AND_VALIDATE
      deployment:
        description: Release and integration into the production environment.
        exact_mappings:
          - nist_ai_100_1:DEPLOY_AND_USE
          - nist_ai_600_1:DEPLOYMENT
      operation_and_monitoring:
        description: Ongoing operation, monitoring, and support.
        exact_mappings:
          - nist_ai_100_1:OPERATE_AND_MONITOR
        close_mappings:
          - nist_ai_600_1:OPERATION
      continuous_validation:
        description: Continuous validation, including drift detection and re-training triggers.
        close_mappings:
          - nist_ai_100_1:OPERATE_AND_MONITOR
      re_evaluation:
        description: Re-evaluation following significant changes or new evidence.
        close_mappings:
          - nist_ai_100_1:OPERATE_AND_MONITOR
      decommissioning:
        description: Retirement, disposal, and post-decommissioning obligations.

        exact_mappings:
          - nist_ai_600_1:DECOMMISSIONING
        related_mappings:
          - nist_ai_100_1:OPERATE_AND_MONITOR
    close_mappings:
      - nist_ai_100_1:AiLifecycleStageEnum
      - nist_ai_600_1:GaiLifecycleStageEnum
  AIOrganizationalRole:
    description: >-
      Roles an organization may take with respect to an AI system, paraphrased
      from the role taxonomy referenced in ISO/IEC 22989 and the NIST AI RMF.
    in_subset:
      - aims_core
    permissible_values:
      ai_provider:
        description: >-
          Organization providing AI platforms, products, or services to
          others.
        close_mappings:
          - nist_ai_100_1:AI_DEVELOPMENT
      ai_producer:
        description: >-
          Organization or actor that develops, designs, operates, tests,
          evaluates, deploys, or governs AI systems.
        close_mappings:
          - nist_ai_100_1:AI_DESIGN
      ai_customer:
        description: Organization or individual that uses an AI product or service.
        close_mappings:
          - nist_ai_100_1:END_USERS
          - nist_ai_600_1:END_USERS
      ai_partner:
        description: System integrators and data providers for AI systems.
        close_mappings:
          - iso29100:ThirdParty
          - nist_ai_100_1:THIRD_PARTY_ENTITIES
      ai_subject:
        description: >-
          Individuals or groups whose data or interests are affected by an
          AI system (e.g., data subjects).
        close_mappings:
          - iso29100:PIIPrincipal
          - nist_ai_100_1:AFFECTED_INDIVIDUALS_OR_COMMUNITIES
          - nist_ai_600_1:AFFECTED_INDIVIDUALS_AND_COMMUNITIES
      relevant_authority:
        description: Policymakers, regulators, and other oversight bodies.

        close_mappings:
          - nist_ai_100_1:GOVERNANCE_AND_OVERSIGHT
          - nist_ai_600_1:GOVERNANCE_AND_OVERSIGHT
    close_mappings:
      - nist_ai_100_1:AiActorTaskEnum
      - nist_ai_600_1:GaiActorTaskEnum
  DataResourceCategory:
    description: >-
      Categories of data resources documented for AI systems per A.7
      (Data for AI systems).
    in_subset:
      - ai_data_management
    permissible_values:
      training:
        description: Data used to train machine learning models.
      validation:
        description: Data used for model selection and hyperparameter tuning.
      test:
        description: Data used to evaluate model performance prior to deployment.
      production:
        description: Live operational data processed by the deployed AI system.
      reference:
        description: Reference datasets used for benchmarking or comparison.

  AIObjectiveCategory:
    description: >-
      Categories of organizational objectives associated with responsible
      development and use of AI systems, paraphrased from Annex C of
      ISO/IEC 42001:2023.
    in_subset:
      - ai_risk_management
    permissible_values:
      accountability:
        description: Clear allocation of responsibility for AI-supported decisions.
      ai_expertise:
        description: Availability of interdisciplinary expertise for AI activities.
      data_quality:
        description: Adequate quality of training, validation, and test data.
        close_mappings:
          - iso29100:accuracy_and_quality
      environmental_impact:
        description: Management of positive and negative environmental effects.
      fairness:
        description: Avoiding inappropriate or unfair outcomes for individuals or groups.
        close_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
        related_mappings:
          - iso29100:individual_participation_and_access
      maintainability:
        description: Ability to correct defects and accommodate new requirements.
      privacy:
        description: Protection of personal and sensitive data processed by AI systems.
        exact_mappings:
          - iso29100:PrivacyPrinciple
          - nist_ai_100_1:TrustworthinessCharacteristic
      robustness:
        description: Comparable performance on new and operational data.
        close_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
      safety:
        description: Avoidance of harm to life, health, property, or the environment.
        exact_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
      security:
        description: Protection from AI-specific and conventional security threats.
        exact_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
        close_mappings:
          - iso29100:information_security
      transparency:
        description: Visibility into organizational AI practices and AI system behaviour.
        close_mappings:
          - iso29100:openness_transparency_and_notice
          - nist_ai_100_1:TrustworthinessCharacteristic
      explainability:
        description: Comprehensible explanations of important factors driving AI outputs.
        exact_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
      reliability:
        description: Consistent performance under defined conditions.
        close_mappings:
          - nist_ai_100_1:TrustworthinessCharacteristic
      accessibility:
        description: Usability of AI systems by people with diverse abilities.
      availability_of_training_data:
        description: >-
          Sufficient availability and quality of training, validation, and
          test data needed to train and verify AI systems (Annex C.2.3).

    close_mappings:
      - iso29100:PrivacyPrinciple
      - nist_ai_100_1:TrustworthinessCharacteristic
  AIRiskSourceCategory:
    description: >-
      Categories of AI risk sources, paraphrased from Annex C of
      ISO/IEC 42001:2023.
    in_subset:
      - ai_risk_management
    permissible_values:
      complexity_of_environment:
        description: >-
          Performance uncertainty in complex or open operational environments
          (e.g., autonomous systems).
      lack_of_transparency_or_explainability:
        description: >-
          Inability to provide adequate information to interested parties,
          affecting trustworthiness and accountability.
        exact_mappings:
          - nist_ai_100_1:INSCRUTABILITY
      level_of_automation:
        description: >-
          Effects of automation on safety, fairness, security, or human
          oversight.
      machine_learning_specific:
        description: >-
          Risks tied to data collection, data quality, and ML-specific
          phenomena such as data poisoning.
        close_mappings:
          - nist_ai_100_1:TRACKING_EMERGENT_RISKS
          - nist_ai_600_1:TRAINING
      hardware:
        description: >-
          Hardware errors or behavioural differences when transferring
          trained models between systems.
      lifecycle:
        description: >-
          Risks introduced at any AI system life cycle stage, including
          design flaws, deployment issues, or decommissioning gaps.
        exact_mappings:
          - nist_ai_100_1:RISK_AT_DIFFERENT_LIFECYCLE_STAGES
        close_mappings:
          - nist_ai_600_1:DESIGN
      technology_readiness:
        description: >-
          Risks from immature technology with unknown limitations as well as
          mature technology subject to technology complacency.

    close_mappings:
      - nist_ai_100_1:RiskMeasurementChallengeEnum
      - nist_ai_600_1:GaiRiskSourceEnum
  DocumentType:
    description: >-
      Categories of documented information referenced in or required by
      ISO/IEC 42001:2023.
    in_subset:
      - documented_information
    permissible_values:
      policy:
        description: >-
          High-level statement of intent and direction (e.g., AI policy per 5.2).
      procedure:
        description: Documented steps for performing AIMS activities consistently.
      standard:
        description: Mandatory requirements for specific AI technologies or processes.
      guideline:
        description: Recommended practices that support AI-related policies.
      record:
        description: Evidence of AIMS activities performed or results achieved.
      plan:
        description: >-
          Documented approach for achieving objectives (e.g., AI risk treatment
          plan, deployment plan).
      report:
        description: >-
          Formal output of assessment, audit, impact assessment, or review
          activities.
      technical_documentation:
        description: >-
          AI system technical documentation provided to users, partners,
          supervisory authorities, and other interested parties per A.6.2.7
          and A.8.2.

    exact_mappings:
      - iso27001:DocumentType
  AuditFindingType:
    description: Classification of internal audit findings for the AIMS.
    in_subset:
      - performance_evaluation
    permissible_values:
      major_nonconformity:
        description: >-
          Significant failure to fulfill a requirement that affects the
          AIMS ability to achieve its intended outcomes.
      minor_nonconformity:
        description: >-
          Isolated lapse that does not significantly affect AIMS
          effectiveness.
      observation:
        description: >-
          Noted condition that could lead to a nonconformity if not
          addressed.
        aliases:
          - opportunity_for_improvement
      positive_finding:
        description: >-
          Evidence of effective implementation exceeding requirements.

    exact_mappings:
      - iso27001:AuditFindingType
  ImpactAssessmentDimension:
    description: >-
      Dimensions evaluated during an AI system impact assessment per
      Clause 6.1.4. Combines individual/group impacts (Annex A.5.4 /
      Annex B.5.4) with societal-scope impacts (Annex A.5.5 / Annex B.5.5).
    in_subset:
      - ai_risk_management
    permissible_values:
      individual:
        description: >-
          Consequences for individual persons interacting with or affected by the AI system.
      group:
        description: Consequences for identifiable groups of individuals.
      societal:
        description: Broader societal consequences.
      fairness:
        description: >-
          Fair and non-discriminatory treatment of affected individuals and groups (B.5.4).
      transparency:
        description: Transparency of organizational AI practices and AI system behaviour (B.5.4).
      explainability:
        description: Comprehensibility of important factors driving AI outputs (B.5.4).
      accountability:
        description: Clear allocation of accountability for AI-supported decisions (B.5.4).
      accessibility:
        description: Accessibility of the AI system for people with diverse abilities (B.5.4).
      human_rights:
        description: Effects on fundamental human rights (B.5.4).
      financial:
        description: Financial consequences for affected individuals or organizations (B.5.4).
      health:
        description: Effects on physical or mental health (B.5.4).
      environmental:
        description: Environmental consequences attributable to the AI system (B.5.5).
      economic:
        description: Wider economic consequences (B.5.5).
      government:
        description: Consequences for democratic processes, governance, or rule of law (B.5.5).
      cultural_norms:
        description: Consequences for cultural norms, traditions, or values (B.5.5).
      safety:
        description: Safety-related consequences in the deployment context.
      privacy:
        description: Privacy-related consequences for data subjects.
      security:
        description: Information security consequences attributable to the AI system.

  AnnexAControlId:
    description: >-
      Normative reference control identifiers from Annex A of ISO/IEC 42001:2023
      (38 controls across nine families A.2-A.10). Permissible value names use
      underscores in place of dots; the `meaning` slot preserves the
      Annex A dotted form. Control titles are paraphrased.
    in_subset:
      - annex_a_controls
    permissible_values:
      a_2_2:
        description: AI policy - document a policy governing AI system development or use.
        annotations: { annex_a_id: "A.2.2", control_family: "A.2" }
      a_2_3:
        description: >-
          Alignment with other organizational policies - reconcile AI objectives with related
          policies.
        annotations: { annex_a_id: "A.2.3", control_family: "A.2" }
      a_2_4:
        description: >-
          Review of the AI policy - planned and event-driven policy review for suitability and
          effectiveness.
        annotations: { annex_a_id: "A.2.4", control_family: "A.2" }
      a_3_2:
        description: >-
          AI roles and responsibilities - define and allocate AI-related roles per organizational
          needs.
        annotations: { annex_a_id: "A.3.2", control_family: "A.3" }
      a_3_3:
        description: >-
          Reporting of concerns - process for raising concerns about the organization's role with
          respect to AI.
        annotations: { annex_a_id: "A.3.3", control_family: "A.3" }
      a_4_2:
        description: >-
          Resource documentation - identify and document resources used at each AI lifecycle stage.
        annotations: { annex_a_id: "A.4.2", control_family: "A.4" }
      a_4_3:
        description: Data resources - document data resources used by the AI system.
        annotations: { annex_a_id: "A.4.3", control_family: "A.4" }
      a_4_4:
        description: Tooling resources - document tooling resources used by the AI system.
        annotations: { annex_a_id: "A.4.4", control_family: "A.4" }
      a_4_5:
        description: >-
          System and computing resources - document system and computing resources used by the AI
          system.
        annotations: { annex_a_id: "A.4.5", control_family: "A.4" }
      a_4_6:
        description: >-
          Human resources - document human resources and competences across the AI lifecycle.
        annotations: { annex_a_id: "A.4.6", control_family: "A.4" }
      a_5_2:
        description: >-
          AI system impact assessment process - establish a process to assess consequences across
          the lifecycle.
        annotations: { annex_a_id: "A.5.2", control_family: "A.5" }
      a_5_3:
        description: >-
          Documentation of AI system impact assessments - record and retain assessment results.
        annotations: { annex_a_id: "A.5.3", control_family: "A.5" }
      a_5_4:
        description: >-
          Assessing AI system impact on individuals or groups - evaluate and document impacts to
          individuals.
        annotations: { annex_a_id: "A.5.4", control_family: "A.5" }
      a_5_5:
        description: >-
          Assessing societal impacts of AI systems - evaluate and document broader societal impacts.
        annotations: { annex_a_id: "A.5.5", control_family: "A.5" }
      a_6_1_2:
        description: >-
          Objectives for responsible development - identify objectives that guide responsible AI
          development.
        annotations: { annex_a_id: "A.6.1.2", control_family: "A.6" }
      a_6_1_3:
        description: >-
          Processes for responsible AI system design and development - document the design and
          development processes.
        annotations: { annex_a_id: "A.6.1.3", control_family: "A.6" }
      a_6_2_2:
        description: >-
          AI system requirements and specification - specify requirements for new or enhanced AI
          systems.
        annotations: { annex_a_id: "A.6.2.2", control_family: "A.6" }
      a_6_2_3:
        description: >-
          Documentation of AI system design and development - document design and development
          against requirements.
        annotations: { annex_a_id: "A.6.2.3", control_family: "A.6" }
      a_6_2_4:
        description: >-
          AI system verification and validation - define and document V&V measures and criteria.
        annotations: { annex_a_id: "A.6.2.4", control_family: "A.6" }
      a_6_2_5:
        description: >-
          AI system deployment - document a deployment plan and verify pre-deployment requirements.
        annotations: { annex_a_id: "A.6.2.5", control_family: "A.6" }
      a_6_2_6:
        description: >-
          AI system operation and monitoring - document operational and performance monitoring,
          repairs, updates, and support.
        annotations: { annex_a_id: "A.6.2.6", control_family: "A.6" }
      a_6_2_7:
        description: >-
          AI system technical documentation - provide technical documentation tailored to each
          interested party.
        annotations: { annex_a_id: "A.6.2.7", control_family: "A.6" }
      a_6_2_8:
        description: >-
          AI system recording of event logs - enable event log recording across relevant lifecycle
          phases.
        annotations: { annex_a_id: "A.6.2.8", control_family: "A.6" }
      a_7_2:
        description: >-
          Data for development and enhancement - define and implement data management processes for
          AI development.
        annotations: { annex_a_id: "A.7.2", control_family: "A.7" }
      a_7_3:
        description: >-
          Acquisition of data - document acquisition and selection details for data used in AI
          systems.
        annotations: { annex_a_id: "A.7.3", control_family: "A.7" }
      a_7_4:
        description: Quality of data for AI systems - define and meet data quality requirements.
        annotations: { annex_a_id: "A.7.4", control_family: "A.7" }
      a_7_5:
        description: >-
          Data provenance - record data provenance across the data and AI system life cycles.
        annotations: { annex_a_id: "A.7.5", control_family: "A.7" }
      a_7_6:
        description: Data preparation - document criteria and methods used for data preparation.
        annotations: { annex_a_id: "A.7.6", control_family: "A.7" }
      a_8_2:
        description: >-
          System documentation and information for users - provide information needed by AI system
          users.
        annotations: { annex_a_id: "A.8.2", control_family: "A.8" }
      a_8_3:
        description: External reporting - enable interested parties to report adverse impacts.
        annotations: { annex_a_id: "A.8.3", control_family: "A.8" }
      a_8_4:
        description: >-
          Communication of incidents - document a plan for communicating incidents to users.
        annotations: { annex_a_id: "A.8.4", control_family: "A.8" }
      a_8_5:
        description: >-
          Information for interested parties - document obligations to report AI system information
          to interested parties.
        annotations: { annex_a_id: "A.8.5", control_family: "A.8" }
      a_9_2:
        description: >-
          Processes for responsible use of AI systems - define and document responsible use
          processes.
        annotations: { annex_a_id: "A.9.2", control_family: "A.9" }
      a_9_3:
        description: >-
          Objectives for responsible use of AI system - identify and document responsible-use
          objectives.
        annotations: { annex_a_id: "A.9.3", control_family: "A.9" }
      a_9_4:
        description: >-
          Intended use of the AI system - ensure use aligns with the documented intended use.
        annotations: { annex_a_id: "A.9.4", control_family: "A.9" }
      a_10_2:
        description: >-
          Allocating responsibilities - allocate AI lifecycle responsibilities across organization,
          partners, suppliers, customers, third parties.
        annotations: { annex_a_id: "A.10.2", control_family: "A.10" }
      a_10_3:
        description: >-
          Suppliers - ensure supplier-provided services, products, and materials align with the
          organization's responsible AI approach.
        annotations: { annex_a_id: "A.10.3", control_family: "A.10" }
      a_10_4:
        description: >-
          Customers - account for customer expectations and needs in the organization's responsible
          AI approach.
        annotations: { annex_a_id: "A.10.4", control_family: "A.10" }
    close_mappings:
      - iso27001:AnnexAControlId

  SectorDomain:
    description: >-
      Application sectors referenced in Annex D of ISO/IEC 42001:2023 in which
      the AIMS can be deployed jointly with sector-specific management system
      standards (e.g., ISO 13485, ISO 22000, IEC 62304).
    in_subset:
      - aims_core
    permissible_values:
      health:
        description: Health, medical devices, and healthcare delivery contexts.
      defence:
        description: Defence, security, and dual-use technology contexts.
      transport:
        description: Transport, mobility, and autonomous vehicle contexts.
      finance:
        description: Financial services, banking, insurance, and capital markets.
      employment:
        description: Hiring, workforce management, and employee evaluation.
      energy:
        description: Energy production, distribution, and grid management.
      public_sector:
        description: Government, public administration, and public-service delivery.
      education:
        description: Education, training, and academic assessment contexts.
      manufacturing:
        description: Industrial and manufacturing automation.
      agriculture:
        description: Agricultural production and food-supply contexts.
      telecommunications:
        description: Telecommunications and network operations.
      retail:
        description: Retail, e-commerce, and consumer products.
      other:
        description: Other sector not enumerated above.

  LearningParadigm:
    description: >-
      Learning paradigm of an AI system, informing risk considerations related
      to data provenance, drift, and behavioural change over time
      (see ISO/IEC 42001:2023 Introduction and Annex C.3.4).
    in_subset:
      - ai_system_lifecycle
    permissible_values:
      static:
        description: Trained once and deployed without further learning during operation.
      periodic_retraining:
        description: Retrained on a defined cadence with controlled release cycles.
      continuous_learning:
        description: Updates its behaviour during operation based on new data or feedback.
      online_learning:
        description: Continuously updates parameters from a stream of data.
      transfer_learning:
        description: Adapted from a pre-trained model to a new task or domain.
      reinforcement_learning:
        description: Learns a policy through interaction with an environment and reward signals.
      hybrid:
        description: Combines multiple learning paradigms (e.g., supervised plus reinforcement).
      not_applicable:
        description: AI system that is not based on machine learning (e.g., rule-based).

  AIIncidentCategory:
    description: >-
      AI-specific incident categories supplementing classical information
      security incident classes. Supports incident triage and communication
      per Annex A.8.3 (External reporting) and A.8.4 (Communication of
      incidents).
    in_subset:
      - annex_a_controls
    permissible_values:
      data_poisoning:
        description: Training or production data manipulated to compromise model behaviour.
        close_mappings:
          - nist_ai_600_1:INFORMATION_INTEGRITY
      model_stealing:
        description: Unauthorized extraction or reconstruction of a deployed model.
      model_inversion:
        description: Reconstruction of sensitive training data via model queries.
      membership_inference:
        description: Inference of whether a record was part of the training set.
      prompt_injection:
        description: Adversarial inputs causing the model to deviate from intended behaviour.
        close_mappings:
          - nist_ai_600_1:INFORMATION_SECURITY
      hallucination:
        description: Confidently incorrect or fabricated outputs causing material harm.
        exact_mappings:
          - nist_ai_600_1:CONFABULATION
      model_drift:
        description: Performance or behaviour degradation due to distribution shift.
      bias_incident:
        description: Unfair or discriminatory outcomes affecting individuals or groups.
        exact_mappings:
          - nist_ai_600_1:HARMFUL_BIAS_OR_HOMOGENIZATION
        close_mappings:
          - nist_ai_100_1:HARM_TO_PEOPLE
      safety_incident:
        description: Harm to life, health, property, or the environment from AI behaviour.
      privacy_breach:
        description: Unauthorized disclosure of personal data via the AI system.
        exact_mappings:
          - iso29100:PrivacyBreach
        close_mappings:
          - nist_ai_100_1:HARM_TO_PEOPLE
          - nist_ai_600_1:DATA_PRIVACY
      security_breach:
        description: Compromise of confidentiality, integrity, or availability of the AI system.
        close_mappings:
          - nist_ai_100_1:HARM_TO_AN_ORGANIZATION
          - nist_ai_600_1:INFORMATION_SECURITY
      misuse:
        description: Use of the AI system outside its documented intended use.
        related_mappings:
          - nist_ai_600_1:DANGEROUS_VIOLENT_OR_HATEFUL_CONTENT
      adverse_societal_impact:
        description: Broader societal harm reported by external interested parties.
        close_mappings:
          - nist_ai_100_1:HARM_TO_AN_ECOSYSTEM
          - nist_ai_600_1:ENVIRONMENTAL_IMPACTS
      other:
        description: Other AI incident category not enumerated above.

    close_mappings:
      - iso27001:SecurityIncidentCategory
      - nist_ai_100_1:HarmCategoryEnum
      - nist_ai_600_1:GaiRiskCategoryEnum
  AuditType:
    description: >-
      Type of audit conducted against the AIMS per Clause 9.2 and the
      ISO 19011 audit taxonomy.
    in_subset:
      - performance_evaluation
    permissible_values:
      internal:
        description: First-party audit conducted by the organization itself or on its behalf.
      external_second_party:
        description: Second-party audit conducted by an interested party (e.g., customer).
      external_third_party:
        description: Third-party audit conducted by an independent certification body.
      surveillance:
        description: Ongoing surveillance audit during the certification cycle.
      recertification:
        description: Audit performed to renew certification.
      combined:
        description: Combined audit covering two or more management system disciplines.

    exact_mappings:
      - iso27001:AuditType
  MLApproach:
    description: >-
      Machine-learning approach used by the AI system, capturing the
      design-choice dimension referenced in B.6.2.3. Distinct from
      `LearningParadigm`, which describes how often the model updates.
    in_subset:
      - ai_system_lifecycle
    permissible_values:
      supervised:
        description: Learns from labelled examples.
      unsupervised:
        description: Discovers structure in unlabelled data.
      semi_supervised:
        description: Combines a small labelled set with a larger unlabelled set.
      self_supervised:
        description: Generates supervisory signals from the data itself.
      reinforcement:
        description: Learns a policy through interaction with an environment and reward signals.
      transfer:
        description: Adapts a pre-trained model to a new task or domain.
      federated:
        description: Trains across distributed data holders without centralizing raw data.
      generative:
        description: Generative modelling approach (e.g., LLMs, diffusion models).
      symbolic:
        description: Rule-based or symbolic reasoning, not statistical ML.
      hybrid:
        description: Combines multiple ML approaches.
      not_applicable:
        description: AI system not based on machine learning.

  DataPreparationMethod:
    description: >-
      Common data preparation and transformation methods documented per
      Annex A.7.6 and Annex B.7.6.
    in_subset:
      - ai_data_management
    permissible_values:
      statistical_exploration:
        description: >-
          Distribution, mean, median, standard deviation, range, stratification, sampling.
      cleaning:
        description: Correcting entries and handling malformed records.
      imputation:
        description: Filling in missing entries.
      normalization:
        description: Re-scaling values to a common range or distribution.
      scaling:
        description: Multiplicative re-scaling of feature values.
      labelling:
        description: Assigning target labels to records.
      encoding:
        description: Converting categorical variables to numeric representations.
      augmentation:
        description: Synthesising additional training samples from existing data.
      deduplication:
        description: Removing duplicate records.
      anonymization:
        description: Removing or transforming personally identifying information.
      other:
        description: Other preparation method not enumerated above.

  RelatedManagementSystem:
    description: >-
      Related management-system standards with which the AIMS may be
      jointly implemented, per the Introduction (Compatibility with other
      management system standards) and Annex D.
    in_subset:
      - aims_core
    permissible_values:
      iso_iec_27001:
        description: Information security management systems.
      iso_iec_27701:
        description: Privacy information management.
      iso_9001:
        description: Quality management systems.
      iso_22000:
        description: Food safety management systems.
      iso_13485:
        description: Medical-device quality management systems.
      iec_62304:
        description: Medical device software life cycle processes.
      iso_iec_5338:
        description: AI system life cycle process.
      iso_iec_5259:
        description: Data quality for analytics and ML.
      iso_iec_22989:
        description: AI concepts and terminology (normative reference).
      iso_iec_23894:
        description: AI risk management guidance.
      iso_iec_38507:
        description: Governance of IT - AI governance implications.
      iso_iec_27000:
        description: Information security management - overview and vocabulary.
      iso_iec_29100:
        description: Privacy framework.
      iso_31000:
        description: Risk management guidelines.
      iso_iec_25024:
        description: Measurement of data quality.
      iso_iec_25059:
        description: Quality model for AI systems.
      iso_19011:
        description: Guidelines for auditing management systems.
      iso_37002:
        description: Whistleblowing management systems (informs A.3.3 concern reporting).
      other:
        description: Other management system standard not enumerated above.

    exact_mappings:
      - iso27001:RelatedManagementSystem
  GovernanceRoleType:
    description: >-
      Governance role types within the AIMS, paraphrased from Clause 3.3
      (top management), Clause 3.22 (governing body), Clause 5.3, and
      Annex A.3.2. Use this enum on `role_type` for normative governance
      positions; free-form strings remain accepted for organization-defined
      roles.
    in_subset:
      - aims_core
    permissible_values:
      governing_body:
        description: >-
          Board, trustees, or other body accountable for organizational performance (3.22).
      top_management:
        description: >-
          Person or group directing and controlling the organization at the highest level (3.3).
      designated_management:
        description: >-
          Management designated to approve AI risk treatment plans and residual-risk acceptance
          (6.1.3).
      chief_ai_officer:
        description: Senior executive accountable for the AIMS.
      ai_risk_owner:
        description: Person accountable for managing a specific AI risk (6.1.2).
      ai_policy_owner:
        description: Role accountable for AI policy development and review (A.2.4).
      ai_oversight_committee:
        description: Cross-functional committee providing oversight of AI systems.
      data_steward:
        description: Role accountable for data resources used by AI systems (A.4.3, A.7).
      model_validator:
        description: Role responsible for verification and validation of AI models (A.6.2.4).
      human_oversight_reviewer:
        description: Role performing human-in-the-loop review of AI outputs (B.9.3).
      ai_developer:
        description: Role developing AI systems or components.
      ai_operator:
        description: Role operating and monitoring AI systems in production.
      ai_impact_assessor:
        description: Role conducting AI system impact assessments (6.1.4).
      auditor:
        description: Internal or external auditor of the AIMS (9.2).
      other:
        description: Other governance role not enumerated above.

# ==============================================================================
# CLASSES
# ==============================================================================

classes:
  # ---------------------
  # Abstract Base Classes
  # ---------------------

  NamedEntity:
    abstract: true
    description: >-
      Abstract base class for all entities with an identifier, name, and
      description. Provides common identification and documentation slots.
    comments:
      - All concrete classes should inherit from this or a subclass
    slots:
      - id
      - name
      - description
      - created_date
      - modified_date
      - version
    slot_usage:
      id:
        identifier: true
        required: true
        description: Unique identifier for this entity instance.

    exact_mappings:
      - iso27001:NamedEntity
  DocumentedInformation:
    is_a: NamedEntity
    abstract: true
    description: >-
      Abstract class for documented information per Clause 7.5.
      Captures metadata required for document control under the AIMS.
    comments:
      - Captures Clause 7.5 metadata needed for document control, review, and retention
      - Sub-classes inherit document_type, owner, approval, and review-date slots
    in_subset:
      - documented_information
    exact_mappings:
      - iso27001:DocumentedInformation
    annotations:
      iso42001_clause: "7.5"
    slots:
      - document_type
      - document_reference
      - author
      - owner
      - approved_by
      - approved_date
      - effective_date
      - review_date
      - status
      - classification
      - retention_period

    # ---------------------
    # Core AIMS Classes (Clauses 4-10)
    # ---------------------

    close_mappings:
      - nist_ai_100_1:PlaybookEntry
  AIManagementSystem:
    is_a: NamedEntity
    description: >-
      Top-level container representing an organization's complete AI
      Management System (AIMS) per ISO/IEC 42001:2023. Aggregates all
      components required to support the AIMS lifecycle.
    in_subset:
      - aims_core
    comments:
      - Root entity for any ISO/IEC 42001 conformance dataset
      - >-
        Reference: ISO/IEC 42001:2023 Clause 4.4. ISO/IEC standards text is copyright ISO/IEC -
        not reproduced here.
    annotations:
      iso42001_clause: "4.4"
      mandatory: "true"
    slots:
      - organization
      - scope_statement
      - scope_boundaries
      - scope_exclusions
      - context_internal_issues
      - context_external_issues
      - organizational_roles_with_ai
      - integrated_management_systems
      - top_management
      - governing_body
      - leadership_commitment_evidence
      - planned_changes
      - interested_parties
      - ai_policy
      - ai_objectives
      - ai_risk_assessment_process
      - ai_risk_treatment_process
      - ai_system_impact_assessment_process
      - statement_of_applicability
      - reference_controls
      - ai_systems
      - roles
      - resources
      - competence_records
      - awareness_program
      - communication_plan
      - documented_information_register
      - operational_procedures
      - ai_risk_assessments
      - ai_risk_treatment_plans
      - ai_system_impact_assessments
      - monitoring_program
      - internal_audits
      - management_reviews
      - nonconformities
      - corrective_actions
      - improvements
      - third_party_relationships
      - certification_status
      - certification_body
      - certification_date
      - recertification_date
      - ai_system_events
      - ai_incidents
      - concern_reports

    close_mappings:
      - iso27001:InformationSecurityManagementSystem
      - nist_ai_100_1:AiRmfFramework
    related_mappings:
      - iso29100:PrivacyFramework
      - nist_ai_600_1:GaiProfile
  Organization:
    is_a: NamedEntity
    description: >-
      The organization establishing and operating the AIMS. Captures the
      context required by Clause 4.1, including the organization's role(s)
      with respect to AI systems.
    comments:
      - Captures the organizational context required by Clause 4.1
      - AI roles determine the applicability scope of Annex A controls
    in_subset:
      - aims_core
    exact_mappings:
      - iso27001:Organization
      - iso22989:organization
    annotations:
      iso42001_clause: "4.1"
    slots:
      - legal_name
      - trading_names
      - organization_type
      - industry_sector
      - sector_domains
      - size_category
      - employee_count
      - geographic_locations
      - regulatory_jurisdictions
      - parent_organization
      - subsidiaries
      - ai_roles
      - climate_change_relevant

    close_mappings:
      - iso29100:PIIController
      - nist_ai_100_1:AiActor
    related_mappings:
      - iso29100:PIIProcessor
  InterestedParty:
    is_a: NamedEntity
    description: >-
      A stakeholder whose needs and expectations are relevant to the AIMS
      per Clause 4.2. Includes internal and external parties such as users,
      regulators, partners, suppliers, customers, AI subjects, and relevant
      authorities.
    comments:
      - Drives the requirements analysis required by Clause 4.2
      - Includes AI subjects and relevant authorities, not only customers/suppliers
    in_subset:
      - aims_core
    exact_mappings:
      - iso27001:InterestedParty
      - iso22989:interested_party
    annotations:
      iso42001_clause: "4.2"
    slots:
      - party_type
      - relationship
      - requirements
      - communication_needs
      - contact_information

    # ---------------------
    # Leadership and Governance (Clause 5)
    # ---------------------

    close_mappings:
      - iso29100:PrivacyStakeholder
      - nist_ai_100_1:AiActor
  AIPolicy:
    is_a: DocumentedInformation
    description: >-
      The AI policy established by top management per Clause 5.2.
      Provides a framework for setting AI objectives and demonstrates
      commitment to responsible AI.
    comments:
      - Top-management AI policy per Clause 5.2; framework for AI objectives
      - Reviewed at planned intervals per Annex A.2.4
    in_subset:
      - aims_core
      - documented_information
    annotations:
      iso42001_clause: "5.2"
      mandatory: "true"
      annex_a_reference: "A.2"
    slots:
      - policy_statement
      - policy_objectives_framework
      - commitment_statements
      - applicability_statement
      - communication_date
      - acknowledgment_required
      - related_topic_policies
      - last_policy_review_date
      - next_policy_review_date

    close_mappings:
      - iso27001:InformationSecurityPolicy
      - iso29100:PrivacyPolicy
  TopicSpecificPolicy:
    is_a: DocumentedInformation
    description: >-
      A topic-specific policy supporting the overarching AI policy, for
      example covering data governance, fairness, transparency, supplier
      use, or human oversight of AI systems.
    comments:
      - Supports the overarching AI policy with topic-specific guidance (data, fairness, oversight)
      - "Typical topics: data governance, transparency, human oversight, supplier use"
    in_subset:
      - documented_information
    annotations:
      annex_a_reference: "A.2"
    slots:
      - topic_area
      - parent_policy
      - applicable_controls
      - target_audience

    exact_mappings:
      - iso27001:TopicSpecificPolicy
  Role:
    is_a: NamedEntity
    description: >-
      An AI-related role with defined responsibilities and authorities
