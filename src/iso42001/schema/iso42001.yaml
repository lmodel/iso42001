  incident_category:
    description: AI-specific category of the incident.
    range: AIIncidentCategory
    annotations:
      annex_a_reference: "A.8.4"

  severity:
    description: Severity rating of the incident.
    range: RiskLevel

  incident_description:
    description: Free-text description of the incident.
    range: string

  detection_method:
    description: How the incident was detected (monitoring alert, user report, external report).
    range: string

  response_actions:
    description: Response actions taken for the incident.
    range: string
    multivalued: true

  containment_actions:
    description: Containment actions taken to limit incident impact.
    range: string
    multivalued: true

  recovery_actions:
    description: Recovery actions taken to restore normal AI system operation.
    range: string
    multivalued: true

  lessons_learned:
    description: Lessons learned recorded after incident closure.
    range: string
    multivalued: true

  evidence_collected:
    description: References to evidence collected during incident response.
    range: string
    multivalued: true

  notification_required:
    description: Whether notification to interested parties or authorities is required.
    range: boolean

  notifications_made:
    description: Notifications actually made (user communications, regulator filings).
    range: string
    multivalued: true
    annotations:
      annex_a_reference: "A.8.4"

  external_reports:
    description: External reports received or filed regarding the incident.
    range: string
    multivalued: true
    annotations:
      annex_a_reference: "A.8.3"

  closure_datetime:
    description: Date and time the incident was closed.
    range: datetime

  post_incident_review:
    description: Reference to the post-incident review record.
    range: string

  # ---------------------
  # AIMS Governance & Integration Slots
  # ---------------------

  integrated_management_systems:
    description: >-
      Related management-system standards with which the AIMS is jointly
      implemented or aligned (Introduction - Compatibility with other
      management system standards, Annex D).
    range: RelatedManagementSystem
    multivalued: true

    exact_mappings:
      - iso27001:integrated_management_systems
  top_management:
    description: >-
      Reference to the person or group exercising top management
      direction and control over the AIMS (Clause 3.3, 5.1).
    range: string
    annotations:
      iso42001_clause: "3.3"

    exact_mappings:
      - iso27001:top_management
  governing_body:
    description: >-
      Reference to the governing body to which top management is
      accountable (Clause 3.22).
    range: string
    annotations:
      iso42001_clause: "3.22"

    exact_mappings:
      - iso27001:governing_body
  leadership_commitment_evidence:
    description: >-
      Records or references demonstrating top-management leadership and
      commitment to the AIMS per Clause 5.1.
    range: string
    multivalued: true
    annotations:
      iso42001_clause: "5.1"

    exact_mappings:
      - iso27001:leadership_commitment_evidence
  planned_changes:
    description: >-
      Records of planned changes to the AIMS, including purpose,
      consequences, resource implications, and responsibilities per
      Clause 6.3.
    range: string
    multivalued: true
    annotations:
      iso42001_clause: "6.3"

    # ---------------------
    # AI System Oversight & Approach Slots
    # ---------------------

    exact_mappings:
      - iso27001:planned_changes
  ml_approach:
    description: >-
      Machine-learning approach used by the AI system, capturing the
      design-choice dimension referenced in Annex B.6.2.3.
    range: MLApproach
    annotations:
      annex_a_reference: "A.6.2.3"

  human_oversight_required:
    description: >-
      Whether human oversight is required for outputs of the AI system
      (Annex A.9, Annex B.9.3).
    range: boolean
    annotations:
      annex_a_reference: "A.9"

    close_mappings:
      - nist_ai_100_1:human_ai_configuration
  human_oversight_description:
    description: >-
      Description of human-oversight arrangements, including review
      points, escalation paths, and oversight authority (Annex B.9.3).
    range: string

  human_oversight_stages:
    description: >-
      AI system life cycle stages at which human oversight applies
      (Annex B.9.3).
    range: AISystemLifecycleStage
    multivalued: true

  # ---------------------
  # Concern Report Slots (Annex A.3.3)
  # ---------------------

  concern_reports:
    description: Concern reports raised and managed under the AIMS per A.3.3.
    range: ConcernReport
    multivalued: true
    annotations:
      annex_a_reference: "A.3.3"

  reported_date:
    description: Date the concern was reported.
    range: date

  reporter_anonymous:
    description: Whether the reporter chose to remain anonymous.
    range: boolean

  confidentiality_level:
    description: >-
      Confidentiality classification applied to the concern record
      (e.g., confidential, restricted, internal).
    range: string

  reporting_channel:
    description: >-
      Channel through which the concern was reported (e.g., hotline,
      web form, manager, ombudsperson, external auditor).
    range: string

  concern_description:
    description: Paraphrased summary of the concern raised.
    range: string

  concern_ai_systems:
    description: AI systems referenced in the concern report.
    range: AISystem
    multivalued: true

  concern_lifecycle_stage:
    description: >-
      AI system life cycle stage(s) at which the concern arose.
    range: AISystemLifecycleStage
    multivalued: true

  investigator:
    description: Identifier or description of the investigator assigned to the concern.
    range: string

  investigation_status:
    description: >-
      Status of the investigation (e.g., opened, in_progress, closed,
      escalated, referred_external).
    range: string

  investigation_findings:
    description: Paraphrased summary of investigation findings.
    range: string

  escalation_status:
    description: >-
      Whether and how the concern was escalated (internal management,
      governing body, external authority).
    range: string

  response_due_date:
    description: Target date by which a response is owed to the reporter.
    range: date

  response_provided_date:
    description: Date a response was provided to the reporter.
    range: date

  resolution:
    description: Paraphrased description of the resolution provided.
    range: string

  reprisal_protection_actions:
    description: >-
      Actions taken to protect the reporter from reprisals or detriment
      (informed by ISO 37002).
    range: string
    multivalued: true

  related_incidents:
    description: AI incidents linked to this concern report.
    range: AIIncident
    multivalued: true

  related_nonconformities:
    description: Nonconformities linked to this concern report.
    range: Nonconformity
    multivalued: true
