default_prefix: iso42001
default_range: string
subsets:
  aims_core:
    name: aims_core
    definition_uri: https://w3id.org/lmodel/iso42001/AimsCore
    description: Core AIMS structural elements required for conformity with Clauses
      4-10 of ISO/IEC 42001:2023. These classes represent the minimum viable data
      model for AIMS documentation.
    comments:
    - Mandatory for any ISO/IEC 42001 conformance dataset
    - Maps to requirement statements in the standard
    from_schema: https://w3id.org/lmodel/iso42001
  annex_a_controls:
    name: annex_a_controls
    definition_uri: https://w3id.org/lmodel/iso42001/AnnexAControls
    description: Classes and enumerations representing the reference controls in Annex
      A of ISO/IEC 42001:2023, grouped into nine control families (A.2 through A.10).
      Implementation guidance is provided in Annex B.
    from_schema: https://w3id.org/lmodel/iso42001
  ai_risk_management:
    name: ai_risk_management
    definition_uri: https://w3id.org/lmodel/iso42001/AiRiskManagement
    description: Elements supporting AI risk assessment (6.1.2), AI risk treatment
      (6.1.3), and AI system impact assessment (6.1.4). Aligned with ISO 31000:2018
      and ISO/IEC 23894 guidance.
    from_schema: https://w3id.org/lmodel/iso42001
  ai_system_lifecycle:
    name: ai_system_lifecycle
    definition_uri: https://w3id.org/lmodel/iso42001/AiSystemLifecycle
    description: Classes representing the AI system life cycle stages (design, development,
      verification, deployment, operation, monitoring, decommissioning) referenced
      in Annex A.6.
    from_schema: https://w3id.org/lmodel/iso42001
  ai_data_management:
    name: ai_data_management
    definition_uri: https://w3id.org/lmodel/iso42001/AiDataManagement
    description: Elements covering data resources, data acquisition, data quality,
      data provenance, and data preparation for AI systems per A.7.
    from_schema: https://w3id.org/lmodel/iso42001
  performance_evaluation:
    name: performance_evaluation
    definition_uri: https://w3id.org/lmodel/iso42001/PerformanceEvaluation
    description: Classes for monitoring, measurement, internal audit, and management
      review per Clauses 9.1-9.3.
    from_schema: https://w3id.org/lmodel/iso42001
  continual_improvement:
    name: continual_improvement
    definition_uri: https://w3id.org/lmodel/iso42001/ContinualImprovement
    description: Elements for nonconformity management, corrective actions, and improvement
      tracking per Clause 10.
    from_schema: https://w3id.org/lmodel/iso42001
  documented_information:
    name: documented_information
    definition_uri: https://w3id.org/lmodel/iso42001/DocumentedInformation
    description: Classes representing required documented information per Clause 7.5.
      Supports document control and retention requirements.
    from_schema: https://w3id.org/lmodel/iso42001
  third_party_management:
    name: third_party_management
    definition_uri: https://w3id.org/lmodel/iso42001/ThirdPartyManagement
    description: Classes covering allocation of responsibilities to partners, suppliers,
      and customers across the AI system life cycle per A.10.
    from_schema: https://w3id.org/lmodel/iso42001
types:
  positive integer type:
    name: positive integer type
    definition_uri: https://w3id.org/lmodel/iso42001/PositiveIntegerType
    description: integer greater than zero; natural number explicitly excluding zero
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - wikidata:Q28920044
    base: int
    uri: xsd:positiveInteger
  unsigned short type:
    name: unsigned short type
    definition_uri: https://w3id.org/lmodel/iso42001/UnsignedShortType
    description: data type for non-negative integers that can be represented with
      16 bits
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - wikidata:Q110650833
    base: int
    uri: xsd:unsignedShort
  duration type:
    name: duration type
    definition_uri: https://w3id.org/lmodel/iso42001/DurationType
    description: ISO 8601 duration value such as P1Y, P30D, or PT4H
    from_schema: https://w3id.org/lmodel/iso42001
    base: str
    uri: xsd:duration
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  AIControlFamily:
    name: AIControlFamily
    definition_uri: https://w3id.org/lmodel/iso42001/AIControlFamily
    description: The reference control families in Annex A of ISO/IEC 42001:2023.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      ai_policies:
        text: ai_policies
        description: Policies related to AI (Annex A.2) - management direction and
          support for AI systems according to business requirements.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.2
      internal_organization:
        text: internal_organization
        description: Internal organization (Annex A.3) - accountability for responsible
          implementation, operation, and management of AI systems.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.3
      ai_resources:
        text: ai_resources
        description: Resources for AI systems (Annex A.4) - documentation of data,
          tooling, system/computing, and human resources for AI systems.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.4
      impact_assessment:
        text: impact_assessment
        description: Assessing impacts of AI systems (Annex A.5) - evaluation of consequences
          for individuals, groups, and societies across the AI system life cycle.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.5
      ai_system_lifecycle:
        text: ai_system_lifecycle
        description: AI system life cycle (Annex A.6) - responsible design, development,
          verification, deployment, operation, and technical documentation.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.6
      data_for_ai:
        text: data_for_ai
        description: Data for AI systems (Annex A.7) - data management, acquisition,
          quality, provenance, and preparation for AI.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.7
      information_for_parties:
        text: information_for_parties
        description: Information for interested parties (Annex A.8) - system documentation
          for users, external reporting, and incident communications.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.8
      use_of_ai:
        text: use_of_ai
        description: Use of AI systems (Annex A.9) - responsible-use processes, objectives,
          and intended-use enforcement.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.9
      third_party_relationships:
        text: third_party_relationships
        description: Third-party and customer relationships (Annex A.10) - allocating
          responsibilities, supplier management, and customer expectations.
        annotations:
          annex_clause:
            tag: annex_clause
            value: A.10
  ImplementationStatus:
    name: ImplementationStatus
    definition_uri: https://w3id.org/lmodel/iso42001/ImplementationStatus
    description: Lifecycle status of a reference control, used in the AIMS Statement
      of Applicability and control tracking.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:ImplementationStatus
    permissible_values:
      not_started:
        text: not_started
        description: Control identified but no implementation activities begun.
      planned:
        text: planned
        description: Control scheduled for implementation with defined timeline.
      in_progress:
        text: in_progress
        description: Implementation actively underway but not yet complete.
      implemented:
        text: implemented
        description: Control fully implemented and operational.
      not_applicable:
        text: not_applicable
        description: Control excluded from scope with documented justification per
          Clause 6.1.3 f).
  RiskTreatmentOption:
    name: RiskTreatmentOption
    definition_uri: https://w3id.org/lmodel/iso42001/RiskTreatmentOption
    description: Standard risk treatment options drawn from ISO 31000 and adapted
      for AI risk treatment per Clause 6.1.3.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:RiskTreatmentOption
    - nist_ai_100_1:RiskResponseEnum
    permissible_values:
      modify:
        text: modify
        description: Apply controls to change the AI risk level (reduce likelihood
          or consequence).
        aliases:
        - mitigate
        - reduce
        exact_mappings:
        - nist_ai_100_1:MITIGATING
      accept:
        text: accept
        description: Accept the residual AI risk without further treatment, within
          risk appetite, with designated management approval.
        aliases:
        - retain
        exact_mappings:
        - nist_ai_100_1:ACCEPTING
      avoid:
        text: avoid
        description: Eliminate the AI risk by not undertaking the activity that creates
          it (for example, not deploying a high-risk AI use case).
        aliases:
        - terminate
        exact_mappings:
        - nist_ai_100_1:AVOIDING
      share:
        text: share
        description: Transfer or share the AI risk with external parties (e.g., insurance,
          contractual transfer to a supplier or partner).
        aliases:
        - transfer
        exact_mappings:
        - nist_ai_100_1:TRANSFERRING
  RiskLevel:
    name: RiskLevel
    definition_uri: https://w3id.org/lmodel/iso42001/RiskLevel
    description: Qualitative AI risk rating derived from likelihood and consequence
      analysis.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:RiskLevel
    permissible_values:
      very_low:
        text: very_low
        description: Negligible AI risk requiring no immediate action.
      low:
        text: low
        description: Minor AI risk manageable through routine procedures.
      medium:
        text: medium
        description: Moderate AI risk requiring management attention and planned controls.
      high:
        text: high
        description: Significant AI risk requiring priority treatment and escalation.
      critical:
        text: critical
        description: Severe AI risk threatening organizational objectives, individuals,
          or societies; requires immediate executive action.
  LikelihoodRating:
    name: LikelihoodRating
    definition_uri: https://w3id.org/lmodel/iso42001/LikelihoodRating
    description: Qualitative likelihood scale for AI risk assessment.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:LikelihoodRating
    permissible_values:
      rare:
        text: rare
        description: Highly unlikely to occur (< 5% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      unlikely:
        text: unlikely
        description: Not expected but possible (5-20% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      possible:
        text: possible
        description: May occur at some point (20-50% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      likely:
        text: likely
        description: Probably will occur (50-80% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      almost_certain:
        text: almost_certain
        description: Expected to occur in most circumstances (> 80% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  ImpactRating:
    name: ImpactRating
    definition_uri: https://w3id.org/lmodel/iso42001/ImpactRating
    description: Qualitative consequence scale for AI risk assessment, covering impact
      on the organization, individuals, groups, and societies.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:ImpactRating
    permissible_values:
      negligible:
        text: negligible
        description: No significant impact on operations, individuals, or society.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      minor:
        text: minor
        description: Limited impact, easily absorbed by normal operations.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      moderate:
        text: moderate
        description: Noticeable impact requiring management intervention.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      major:
        text: major
        description: Serious impact on objectives, reputation, compliance, or identifiable
          groups of individuals.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      severe:
        text: severe
        description: Catastrophic impact threatening organizational viability, broad
          societal harm, or fundamental rights of affected individuals.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  AISystemLifecycleStage:
    name: AISystemLifecycleStage
    definition_uri: https://w3id.org/lmodel/iso42001/AISystemLifecycleStage
    description: Stages of the AI system life cycle referenced throughout Annex A.6
      and defined in ISO/IEC 5338 / ISO/IEC 22989.
    in_subset:
    - ai_system_lifecycle
    from_schema: https://w3id.org/lmodel/iso42001
    close_mappings:
    - nist_ai_100_1:AiLifecycleStageEnum
    - nist_ai_600_1:GaiLifecycleStageEnum
    permissible_values:
      inception:
        text: inception
        description: Initial conception, feasibility, and use-case definition.
        close_mappings:
        - nist_ai_100_1:PLAN_AND_DESIGN
      design:
        text: design
        description: AI system design including requirements and architecture.
        exact_mappings:
        - nist_ai_100_1:PLAN_AND_DESIGN
        - nist_ai_600_1:DESIGN
      data_collection_and_preparation:
        text: data_collection_and_preparation
        description: Acquiring, labelling, and preparing data resources.
        exact_mappings:
        - nist_ai_100_1:COLLECT_AND_PROCESS_DATA
      development:
        text: development
        description: Model and AI system development and training.
        exact_mappings:
        - nist_ai_100_1:BUILD_AND_USE_MODEL
        - nist_ai_600_1:DEVELOPMENT
      verification_and_validation:
        text: verification_and_validation
        description: Verification and validation of the AI system.
        exact_mappings:
        - nist_ai_100_1:VERIFY_AND_VALIDATE
      deployment:
        text: deployment
        description: Release and integration into the production environment.
        exact_mappings:
        - nist_ai_100_1:DEPLOY_AND_USE
        - nist_ai_600_1:DEPLOYMENT
      operation_and_monitoring:
        text: operation_and_monitoring
        description: Ongoing operation, monitoring, and support.
        exact_mappings:
        - nist_ai_100_1:OPERATE_AND_MONITOR
        close_mappings:
        - nist_ai_600_1:OPERATION
      continuous_validation:
        text: continuous_validation
        description: Continuous validation, including drift detection and re-training
          triggers.
        close_mappings:
        - nist_ai_100_1:OPERATE_AND_MONITOR
      re_evaluation:
        text: re_evaluation
        description: Re-evaluation following significant changes or new evidence.
        close_mappings:
        - nist_ai_100_1:OPERATE_AND_MONITOR
      decommissioning:
        text: decommissioning
        description: Retirement, disposal, and post-decommissioning obligations.
        exact_mappings:
        - nist_ai_600_1:DECOMMISSIONING
        related_mappings:
        - nist_ai_100_1:OPERATE_AND_MONITOR
  AIOrganizationalRole:
    name: AIOrganizationalRole
    definition_uri: https://w3id.org/lmodel/iso42001/AIOrganizationalRole
    description: Roles an organization may take with respect to an AI system, paraphrased
      from the role taxonomy referenced in ISO/IEC 22989 and the NIST AI RMF.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    close_mappings:
    - nist_ai_100_1:AiActorTaskEnum
    - nist_ai_600_1:GaiActorTaskEnum
    permissible_values:
      ai_provider:
        text: ai_provider
        description: Organization providing AI platforms, products, or services to
          others.
        close_mappings:
        - nist_ai_100_1:AI_DEVELOPMENT
      ai_producer:
        text: ai_producer
        description: Organization or actor that develops, designs, operates, tests,
          evaluates, deploys, or governs AI systems.
        close_mappings:
        - nist_ai_100_1:AI_DESIGN
      ai_customer:
        text: ai_customer
        description: Organization or individual that uses an AI product or service.
        close_mappings:
        - nist_ai_100_1:END_USERS
        - nist_ai_600_1:END_USERS
      ai_partner:
        text: ai_partner
        description: System integrators and data providers for AI systems.
        close_mappings:
        - iso29100:ThirdParty
        - nist_ai_100_1:THIRD_PARTY_ENTITIES
      ai_subject:
        text: ai_subject
        description: Individuals or groups whose data or interests are affected by
          an AI system (e.g., data subjects).
        close_mappings:
        - iso29100:PIIPrincipal
        - nist_ai_100_1:AFFECTED_INDIVIDUALS_OR_COMMUNITIES
        - nist_ai_600_1:AFFECTED_INDIVIDUALS_AND_COMMUNITIES
      relevant_authority:
        text: relevant_authority
        description: Policymakers, regulators, and other oversight bodies.
        close_mappings:
        - nist_ai_100_1:GOVERNANCE_AND_OVERSIGHT
        - nist_ai_600_1:GOVERNANCE_AND_OVERSIGHT
  DataResourceCategory:
    name: DataResourceCategory
    definition_uri: https://w3id.org/lmodel/iso42001/DataResourceCategory
    description: Categories of data resources documented for AI systems per A.7 (Data
      for AI systems).
    in_subset:
    - ai_data_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      training:
        text: training
        description: Data used to train machine learning models.
      validation:
        text: validation
        description: Data used for model selection and hyperparameter tuning.
      test:
        text: test
        description: Data used to evaluate model performance prior to deployment.
      production:
        text: production
        description: Live operational data processed by the deployed AI system.
      reference:
        text: reference
        description: Reference datasets used for benchmarking or comparison.
  AIObjectiveCategory:
    name: AIObjectiveCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AIObjectiveCategory
    description: Categories of organizational objectives associated with responsible
      development and use of AI systems, paraphrased from Annex C of ISO/IEC 42001:2023.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    close_mappings:
    - iso29100:PrivacyPrinciple
    - nist_ai_100_1:TrustworthinessCharacteristic
    permissible_values:
      accountability:
        text: accountability
        description: Clear allocation of responsibility for AI-supported decisions.
      ai_expertise:
        text: ai_expertise
        description: Availability of interdisciplinary expertise for AI activities.
      data_quality:
        text: data_quality
        description: Adequate quality of training, validation, and test data.
        close_mappings:
        - iso29100:accuracy_and_quality
      environmental_impact:
        text: environmental_impact
        description: Management of positive and negative environmental effects.
      fairness:
        text: fairness
        description: Avoiding inappropriate or unfair outcomes for individuals or
          groups.
        close_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
        related_mappings:
        - iso29100:individual_participation_and_access
      maintainability:
        text: maintainability
        description: Ability to correct defects and accommodate new requirements.
      privacy:
        text: privacy
        description: Protection of personal and sensitive data processed by AI systems.
        exact_mappings:
        - iso29100:PrivacyPrinciple
        - nist_ai_100_1:TrustworthinessCharacteristic
      robustness:
        text: robustness
        description: Comparable performance on new and operational data.
        close_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
      safety:
        text: safety
        description: Avoidance of harm to life, health, property, or the environment.
        exact_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
      security:
        text: security
        description: Protection from AI-specific and conventional security threats.
        exact_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
        close_mappings:
        - iso29100:information_security
      transparency:
        text: transparency
        description: Visibility into organizational AI practices and AI system behaviour.
        close_mappings:
        - iso29100:openness_transparency_and_notice
        - nist_ai_100_1:TrustworthinessCharacteristic
      explainability:
        text: explainability
        description: Comprehensible explanations of important factors driving AI outputs.
        exact_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
      reliability:
        text: reliability
        description: Consistent performance under defined conditions.
        close_mappings:
        - nist_ai_100_1:TrustworthinessCharacteristic
      accessibility:
        text: accessibility
        description: Usability of AI systems by people with diverse abilities.
      availability_of_training_data:
        text: availability_of_training_data
        description: Sufficient availability and quality of training, validation,
          and test data needed to train and verify AI systems (Annex C.2.3).
  AIRiskSourceCategory:
    name: AIRiskSourceCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AIRiskSourceCategory
    description: Categories of AI risk sources, paraphrased from Annex C of ISO/IEC
      42001:2023.
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    close_mappings:
    - nist_ai_100_1:RiskMeasurementChallengeEnum
    - nist_ai_600_1:GaiRiskSourceEnum
    permissible_values:
      complexity_of_environment:
        text: complexity_of_environment
        description: Performance uncertainty in complex or open operational environments
          (e.g., autonomous systems).
      lack_of_transparency_or_explainability:
        text: lack_of_transparency_or_explainability
        description: Inability to provide adequate information to interested parties,
          affecting trustworthiness and accountability.
        exact_mappings:
        - nist_ai_100_1:INSCRUTABILITY
      level_of_automation:
        text: level_of_automation
        description: Effects of automation on safety, fairness, security, or human
          oversight.
      machine_learning_specific:
        text: machine_learning_specific
        description: Risks tied to data collection, data quality, and ML-specific
          phenomena such as data poisoning.
        close_mappings:
        - nist_ai_100_1:TRACKING_EMERGENT_RISKS
        - nist_ai_600_1:TRAINING
      hardware:
        text: hardware
        description: Hardware errors or behavioural differences when transferring
          trained models between systems.
      lifecycle:
        text: lifecycle
        description: Risks introduced at any AI system life cycle stage, including
          design flaws, deployment issues, or decommissioning gaps.
        exact_mappings:
        - nist_ai_100_1:RISK_AT_DIFFERENT_LIFECYCLE_STAGES
        close_mappings:
        - nist_ai_600_1:DESIGN
      technology_readiness:
        text: technology_readiness
        description: Risks from immature technology with unknown limitations as well
          as mature technology subject to technology complacency.
  DocumentType:
    name: DocumentType
    definition_uri: https://w3id.org/lmodel/iso42001/DocumentType
    description: Categories of documented information referenced in or required by
      ISO/IEC 42001:2023.
    in_subset:
    - documented_information
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:DocumentType
    permissible_values:
      policy:
        text: policy
        description: High-level statement of intent and direction (e.g., AI policy
          per 5.2).
      procedure:
        text: procedure
        description: Documented steps for performing AIMS activities consistently.
      standard:
        text: standard
        description: Mandatory requirements for specific AI technologies or processes.
      guideline:
        text: guideline
        description: Recommended practices that support AI-related policies.
      record:
        text: record
        description: Evidence of AIMS activities performed or results achieved.
      plan:
        text: plan
        description: Documented approach for achieving objectives (e.g., AI risk treatment
          plan, deployment plan).
      report:
        text: report
        description: Formal output of assessment, audit, impact assessment, or review
          activities.
      technical_documentation:
        text: technical_documentation
        description: AI system technical documentation provided to users, partners,
          supervisory authorities, and other interested parties per A.6.2.7 and A.8.2.
  AuditFindingType:
    name: AuditFindingType
    definition_uri: https://w3id.org/lmodel/iso42001/AuditFindingType
    description: Classification of internal audit findings for the AIMS.
    in_subset:
    - performance_evaluation
    from_schema: https://w3id.org/lmodel/iso42001
    exact_mappings:
    - iso27001:AuditFindingType
    permissible_values:
      major_nonconformity:
        text: major_nonconformity
        description: Significant failure to fulfill a requirement that affects the
          AIMS ability to achieve its intended outcomes.
      minor_nonconformity:
        text: minor_nonconformity
        description: Isolated lapse that does not significantly affect AIMS effectiveness.
      observation:
        text: observation
        description: Noted condition that could lead to a nonconformity if not addressed.
        aliases:
        - opportunity_for_improvement
      positive_finding:
        text: positive_finding
        description: Evidence of effective implementation exceeding requirements.
  ImpactAssessmentDimension:
    name: ImpactAssessmentDimension
    definition_uri: https://w3id.org/lmodel/iso42001/ImpactAssessmentDimension
    description: Dimensions evaluated during an AI system impact assessment per Clause
      6.1.4. Combines individual/group impacts (Annex A.5.4 / Annex B.5.4) with societal-scope
      impacts (Annex A.5.5 / Annex B.5.5).
    in_subset:
    - ai_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      individual:
        text: individual
        description: Consequences for individual persons interacting with or affected
          by the AI system.
      group:
        text: group
        description: Consequences for identifiable groups of individuals.
      societal:
        text: societal
        description: Broader societal consequences.
      fairness:
        text: fairness
        description: Fair and non-discriminatory treatment of affected individuals
          and groups (B.5.4).
      transparency:
        text: transparency
        description: Transparency of organizational AI practices and AI system behaviour
          (B.5.4).
      explainability:
        text: explainability
        description: Comprehensibility of important factors driving AI outputs (B.5.4).
      accountability:
        text: accountability
        description: Clear allocation of accountability for AI-supported decisions
          (B.5.4).
      accessibility:
        text: accessibility
        description: Accessibility of the AI system for people with diverse abilities
          (B.5.4).
      human_rights:
        text: human_rights
        description: Effects on fundamental human rights (B.5.4).
      financial:
        text: financial
        description: Financial consequences for affected individuals or organizations
          (B.5.4).
      health:
        text: health
        description: Effects on physical or mental health (B.5.4).
      environmental:
        text: environmental
        description: Environmental consequences attributable to the AI system (B.5.5).
      economic:
        text: economic
        description: Wider economic consequences (B.5.5).
      government:
        text: government
        description: Consequences for democratic processes, governance, or rule of
          law (B.5.5).
      cultural_norms:
        text: cultural_norms
        description: Consequences for cultural norms, traditions, or values (B.5.5).
      safety:
        text: safety
        description: Safety-related consequences in the deployment context.
      privacy:
        text: privacy
        description: Privacy-related consequences for data subjects.
      security:
        text: security
        description: Information security consequences attributable to the AI system.
  AnnexAControlId:
    name: AnnexAControlId
    definition_uri: https://w3id.org/lmodel/iso42001/AnnexAControlId
    description: Normative reference control identifiers from Annex A of ISO/IEC 42001:2023
      (38 controls across nine families A.2-A.10). Permissible value names use underscores
      in place of dots; the `meaning` slot preserves the Annex A dotted form. Control
      titles are paraphrased.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso42001
    close_mappings:
    - iso27001:AnnexAControlId
    permissible_values:
      a_2_2:
        text: a_2_2
        description: AI policy - document a policy governing AI system development
          or use.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.2.2
          control_family:
            tag: control_family
            value: A.2
      a_2_3:
        text: a_2_3
        description: Alignment with other organizational policies - reconcile AI objectives
          with related policies.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.2.3
          control_family:
            tag: control_family
            value: A.2
      a_2_4:
        text: a_2_4
        description: Review of the AI policy - planned and event-driven policy review
          for suitability and effectiveness.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.2.4
          control_family:
            tag: control_family
            value: A.2
      a_3_2:
        text: a_3_2
        description: AI roles and responsibilities - define and allocate AI-related
          roles per organizational needs.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.3.2
          control_family:
            tag: control_family
            value: A.3
      a_3_3:
        text: a_3_3
        description: Reporting of concerns - process for raising concerns about the
          organization's role with respect to AI.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.3.3
          control_family:
            tag: control_family
            value: A.3
      a_4_2:
        text: a_4_2
        description: Resource documentation - identify and document resources used
          at each AI lifecycle stage.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.4.2
          control_family:
            tag: control_family
            value: A.4
      a_4_3:
        text: a_4_3
        description: Data resources - document data resources used by the AI system.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.4.3
          control_family:
            tag: control_family
            value: A.4
      a_4_4:
        text: a_4_4
        description: Tooling resources - document tooling resources used by the AI
          system.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.4.4
          control_family:
            tag: control_family
            value: A.4
      a_4_5:
        text: a_4_5
        description: System and computing resources - document system and computing
          resources used by the AI system.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.4.5
          control_family:
            tag: control_family
            value: A.4
      a_4_6:
        text: a_4_6
        description: Human resources - document human resources and competences across
          the AI lifecycle.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.4.6
          control_family:
            tag: control_family
            value: A.4
      a_5_2:
        text: a_5_2
        description: AI system impact assessment process - establish a process to
          assess consequences across the lifecycle.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.5.2
          control_family:
            tag: control_family
            value: A.5
      a_5_3:
        text: a_5_3
        description: Documentation of AI system impact assessments - record and retain
          assessment results.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.5.3
          control_family:
            tag: control_family
            value: A.5
      a_5_4:
        text: a_5_4
        description: Assessing AI system impact on individuals or groups - evaluate
          and document impacts to individuals.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.5.4
          control_family:
            tag: control_family
            value: A.5
      a_5_5:
        text: a_5_5
        description: Assessing societal impacts of AI systems - evaluate and document
          broader societal impacts.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.5.5
          control_family:
            tag: control_family
            value: A.5
      a_6_1_2:
        text: a_6_1_2
        description: Objectives for responsible development - identify objectives
          that guide responsible AI development.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.1.2
          control_family:
            tag: control_family
            value: A.6
      a_6_1_3:
        text: a_6_1_3
        description: Processes for responsible AI system design and development -
          document the design and development processes.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.1.3
          control_family:
            tag: control_family
            value: A.6
      a_6_2_2:
        text: a_6_2_2
        description: AI system requirements and specification - specify requirements
          for new or enhanced AI systems.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.2
          control_family:
            tag: control_family
            value: A.6
      a_6_2_3:
        text: a_6_2_3
        description: Documentation of AI system design and development - document
          design and development against requirements.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.3
          control_family:
            tag: control_family
            value: A.6
      a_6_2_4:
        text: a_6_2_4
        description: AI system verification and validation - define and document V&V
          measures and criteria.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.4
          control_family:
            tag: control_family
            value: A.6
      a_6_2_5:
        text: a_6_2_5
        description: AI system deployment - document a deployment plan and verify
          pre-deployment requirements.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.5
          control_family:
            tag: control_family
            value: A.6
      a_6_2_6:
        text: a_6_2_6
        description: AI system operation and monitoring - document operational and
          performance monitoring, repairs, updates, and support.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.6
          control_family:
            tag: control_family
            value: A.6
      a_6_2_7:
        text: a_6_2_7
        description: AI system technical documentation - provide technical documentation
          tailored to each interested party.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.7
          control_family:
            tag: control_family
            value: A.6
      a_6_2_8:
        text: a_6_2_8
        description: AI system recording of event logs - enable event log recording
          across relevant lifecycle phases.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.6.2.8
          control_family:
            tag: control_family
            value: A.6
      a_7_2:
        text: a_7_2
        description: Data for development and enhancement - define and implement data
          management processes for AI development.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.7.2
          control_family:
            tag: control_family
            value: A.7
      a_7_3:
        text: a_7_3
        description: Acquisition of data - document acquisition and selection details
          for data used in AI systems.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.7.3
          control_family:
            tag: control_family
            value: A.7
      a_7_4:
        text: a_7_4
        description: Quality of data for AI systems - define and meet data quality
          requirements.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.7.4
          control_family:
            tag: control_family
            value: A.7
      a_7_5:
        text: a_7_5
        description: Data provenance - record data provenance across the data and
          AI system life cycles.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.7.5
          control_family:
            tag: control_family
            value: A.7
      a_7_6:
        text: a_7_6
        description: Data preparation - document criteria and methods used for data
          preparation.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.7.6
          control_family:
