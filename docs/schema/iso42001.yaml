    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  AimsClause:
    name: AimsClause
    definition_uri: https://w3id.org/lmodel/iso42001/AimsClause
    description: The numbered clauses and subclauses of the standard from 4 to 10,
      by their numbers. A value's description is this project's own summary, and the
      clause headings and the requirements are ISO's.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      clause_4:
        text: clause_4
        description: Why the system exists and what it reaches.
        title: '4'
      clause_4_1:
        text: clause_4_1
        description: Matters inside and outside that bear on the system, climate among
          them, and the part the organization plays with AI.
        title: '4.1'
      clause_4_2:
        text: clause_4_2
        description: Who has a stake in the system, and what they want from it.
        title: '4.2'
      clause_4_3:
        text: clause_4_3
        description: Where the system stops, stated in writing.
        title: '4.3'
      clause_4_4:
        text: clause_4_4
        description: Having the system and its processes in place, and keeping them
          up.
        title: '4.4'
      clause_5:
        text: clause_5
        description: What top management must do.
        title: '5'
      clause_5_1:
        text: clause_5_1
        description: How top management shows it leads and backs the system.
        title: '5.1'
      clause_5_2:
        text: clause_5_2
        description: Management's written direction on AI.
        title: '5.2'
      clause_5_3:
        text: clause_5_3
        description: Who holds which duty and power, including who checks conformity
          and who reports on performance.
        title: '5.3'
      clause_6:
        text: clause_6
        description: Deciding what to do before doing it.
        title: '6'
      clause_6_1:
        text: clause_6_1
        description: Dealing with what could go well or badly.
        title: '6.1'
      clause_6_1_1:
        text: clause_6_1_1
        description: Criteria for risk, and the actions planned on risks and opportunities.
        title: 6.1.1
      clause_6_1_2:
        text: clause_6_1_2
        description: A repeatable way to find, analyse and rank AI risks.
        title: 6.1.2
      clause_6_1_3:
        text: clause_6_1_3
        description: Choosing treatments and controls, with the Statement of Applicability
          and the plan.
        title: 6.1.3
      clause_6_1_4:
        text: clause_6_1_4
        description: A way to work out what AI systems may do to people and society.
        title: 6.1.4
      clause_6_2:
        text: clause_6_2
        description: Measurable aims for AI, and how each will be reached.
        title: '6.2'
      clause_6_3:
        text: clause_6_3
        description: Changing the system in an orderly way.
        title: '6.3'
      clause_7:
        text: clause_7
        description: What the system needs in order to run.
        title: '7'
      clause_7_1:
        text: clause_7_1
        description: Providing what the system needs.
        title: '7.1'
      clause_7_2:
        text: clause_7_2
        description: People's ability to do the work, and the evidence of it.
        title: '7.2'
      clause_7_3:
        text: clause_7_3
        description: What those who work for the organization must know.
        title: '7.3'
      clause_7_4:
        text: clause_7_4
        description: Who is told what, when and how.
        title: '7.4'
      clause_7_5:
        text: clause_7_5
        description: Keeping information under control.
        title: '7.5'
      clause_7_5_1:
        text: clause_7_5_1
        description: Which information the system holds.
        title: 7.5.1
      clause_7_5_2:
        text: clause_7_5_2
        description: Naming, formatting, reviewing and approving it.
        title: 7.5.2
      clause_7_5_3:
        text: clause_7_5_3
        description: Keeping it to hand and protected.
        title: 7.5.3
      clause_8:
        text: clause_8
        description: Carrying out what was planned.
        title: '8'
      clause_8_1:
        text: clause_8_1
        description: Running and controlling the processes, including those from outside.
        title: '8.1'
      clause_8_2:
        text: clause_8_2
        description: Carrying out risk assessments, on schedule and when things change.
        title: '8.2'
      clause_8_3:
        text: clause_8_3
        description: Carrying out the treatment plan and checking that it works.
        title: '8.3'
      clause_8_4:
        text: clause_8_4
        description: Carrying out impact assessments, on schedule and when things
          change.
        title: '8.4'
      clause_9:
        text: clause_9
        description: Checking how the system is doing.
        title: '9'
      clause_9_1:
        text: clause_9_1
        description: What is measured, how and when, and what the results mean.
        title: '9.1'
      clause_9_2:
        text: clause_9_2
        description: Audits the organization runs on itself.
        title: '9.2'
      clause_9_2_1:
        text: clause_9_2_1
        description: What such an audit must establish, and how often.
        title: 9.2.1
      clause_9_2_2:
        text: clause_9_2_2
        description: The plan for those audits, and how impartial they are.
        title: 9.2.2
      clause_9_3:
        text: clause_9_3
        description: Top management's own look at the system.
        title: '9.3'
      clause_9_3_1:
        text: clause_9_3_1
        description: How often it looks, and to what end.
        title: 9.3.1
      clause_9_3_2:
        text: clause_9_3_2
        description: What it must take in.
        title: 9.3.2
      clause_9_3_3:
        text: clause_9_3_3
        description: What it must produce.
        title: 9.3.3
      clause_10:
        text: clause_10
        description: Getting better and putting things right.
        title: '10'
      clause_10_1:
        text: clause_10_1
        description: Making the system better over time.
        title: '10.1'
      clause_10_2:
        text: clause_10_2
        description: Dealing with an unmet requirement and removing its cause.
        title: '10.2'
  AimsControlArea:
    name: AimsControlArea
    definition_uri: https://w3id.org/lmodel/iso42001/AimsControlArea
    description: The nine areas Annex A sorts its controls into, under names of this
      project's own. An area's number is its annotation.
    in_subset:
    - aims_annex_a
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      policy_direction:
        text: policy_direction
        description: Written direction from management on AI, and how it fits with
          other policies.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.2
          control_count:
            tag: control_count
            value: '3'
        title: A.2
      accountability:
        text: accountability
        description: Who answers for AI within the organization's walls, and the way
          worries are raised.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.3
          control_count:
            tag: control_count
            value: '2'
        title: A.3
      system_resources:
        text: system_resources
        description: 'What each AI system draws on: components, data, tools, computing
          and people.'
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.4
          control_count:
            tag: control_count
            value: '5'
        title: A.4
      impact_assessment:
        text: impact_assessment
        description: Working out what AI systems may do to people and society.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.5
          control_count:
            tag: control_count
            value: '4'
        title: A.5
      system_life_cycle:
        text: system_life_cycle
        description: Building and running AI systems, from the goals set for them
          to their logs.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.6
          control_count:
            tag: control_count
            value: '9'
        title: A.6
      data_management:
        text: data_management
        description: 'The data AI systems use: how it is managed, obtained, kept fit,
          traced and readied.'
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.7
          control_count:
            tag: control_count
            value: '5'
        title: A.7
      stakeholder_information:
        text: stakeholder_information
        description: What users and others are told about a system, and their way
          to report harm.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.8
          control_count:
            tag: control_count
            value: '4'
        title: A.8
      responsible_use:
        text: responsible_use
        description: How AI systems are put to use, against the organization's goals
          and the systems' documents.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.9
          control_count:
            tag: control_count
            value: '3'
        title: A.9
      external_relationships:
        text: external_relationships
        description: Duties shared with partners, suppliers and customers.
        annotations:
          annex_a_clause:
            tag: annex_a_clause
            value: A.10
          control_count:
            tag: control_count
            value: '3'
        title: A.10
  AimsAnnexAControl:
    name: AimsAnnexAControl
    definition_uri: https://w3id.org/lmodel/iso42001/AimsAnnexAControl
    annotations:
      control_count:
        tag: control_count
        value: '38'
      iso42001_clause:
        tag: iso42001_clause
        value: Annex A
    description: The 38 reference controls of Annex A. A value's title holds the control's
      number and a name of this project's own, and its description says in this project's
      words what the control asks for. The headings and the control text are ISO's.
    in_subset:
    - aims_annex_a
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      a_2_2:
        text: a_2_2
        description: Set down in writing how the organization means to treat AI systems.
        annotations:
          area:
            tag: area
            value: policy_direction
        title: A.2.2 Written direction on AI
      a_2_3:
        text: a_2_3
        description: Find where the organization's other policies touch its aims for
          AI, in either direction.
        annotations:
          area:
            tag: area
            value: policy_direction
        title: A.2.3 Fit with other policies
      a_2_4:
        text: a_2_4
        description: Look at the AI policy again on a schedule and whenever the need
          arises, to see that it still serves.
        annotations:
          area:
            tag: area
            value: policy_direction
        title: A.2.4 Regular policy check
      a_3_2:
        text: a_3_2
        description: Decide who carries which duty for AI, as the organization's needs
          dictate.
        annotations:
          area:
            tag: area
            value: accountability
        title: A.3.2 Who answers for what
      a_3_3:
        text: a_3_3
        description: Give people a way to raise worries about the organization's part
          in a system, at any point in that system's life.
        annotations:
          area:
            tag: area
            value: accountability
        title: A.3.3 A way to raise worries
      a_4_2:
        text: a_4_2
        description: List what each stage of a system's life, and other AI work, draws
          on.
        annotations:
          area:
            tag: area
            value: system_resources
        title: A.4.2 Inventory of what is needed
      a_4_3:
        text: a_4_3
        description: Record facts about the data a system draws on.
        annotations:
          area:
            tag: area
            value: system_resources
        title: A.4.3 Record of data used
      a_4_4:
        text: a_4_4
        description: Record facts about the tools a system draws on.
        annotations:
          area:
            tag: area
            value: system_resources
        title: A.4.4 Record of tools used
      a_4_5:
        text: a_4_5
        description: Record facts about the hardware and computing a system draws
          on.
        annotations:
          area:
            tag: area
            value: system_resources
        title: A.4.5 Record of infrastructure used
      a_4_6:
        text: a_4_6
        description: Record who works on a system across its whole life, and what
          skills they bring.
        annotations:
          area:
            tag: area
            value: system_resources
        title: A.4.6 Record of people used
      a_5_2:
        text: a_5_2
        description: Set up a way to work out what a system could do to people and
          society over its life.
        annotations:
          area:
            tag: area
            value: impact_assessment
        title: A.5.2 Method for weighing consequences
      a_5_3:
        text: a_5_3
        description: Write down what each impact assessment found, and hold on to
          it for a set time.
        annotations:
          area:
            tag: area
            value: impact_assessment
        title: A.5.3 Keeping assessment results
      a_5_4:
        text: a_5_4
        description: Work out and record how a system could affect single persons
          or particular groups over its life.
        annotations:
          area:
            tag: area
            value: impact_assessment
        title: A.5.4 Effects on people
      a_5_5:
        text: a_5_5
        description: Work out and record how a system could affect society over its
          life.
        annotations:
          area:
            tag: area
            value: impact_assessment
        title: A.5.5 Effects on society
      a_6_1_2:
        text: a_6_1_2
        description: Set goals that steer responsible building, and work measures
          for them into the development cycle.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.1
        title: A.6.1.2 Goals for building
      a_6_1_3:
        text: a_6_1_3
        description: Set down the particular processes for designing and building
          a system responsibly.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.1
        title: A.6.1.3 Defined ways of building
      a_6_2_2:
        text: a_6_2_2
        description: Write down what a new system, or a large upgrade to one, must
          meet.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.2 What a system must do
      a_6_2_3:
        text: a_6_2_3
        description: Write down how a system was designed and built, against the goals
          and the requirements.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.3 Build records
      a_6_2_4:
        text: a_6_2_4
        description: Set the checks that verify and validate a system, and say when
          each applies.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.4 Checks and their criteria
      a_6_2_5:
        text: a_6_2_5
        description: Keep a plan for putting a system into service, and meet its conditions
          first.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.5 Going live
      a_6_2_6:
        text: a_6_2_6
        description: 'Set down what keeping a system in service takes: at least watching
          it, fixing it, updating it and supporting it.'
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.6 Running and watching
      a_6_2_7:
        text: a_6_2_7
        description: Decide what technical documents each kind of reader needs, and
          give them those documents in a suitable form.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.7 Documents per audience
      a_6_2_8:
        text: a_6_2_8
        description: Decide at which points in a system's life it keeps event logs,
          and keep them at least while it is in service.
        annotations:
          area:
            tag: area
            value: system_life_cycle
          control_objective:
            tag: control_objective
            value: A.6.2
        title: A.6.2.8 Keeping logs
      a_7_2:
        text: a_7_2
        description: Set down and follow processes that manage the data used to build
          systems.
        annotations:
          area:
            tag: area
            value: data_management
        title: A.7.2 Managing data for building
      a_7_3:
        text: a_7_3
        description: Record how the data a system uses was obtained and picked.
        annotations:
          area:
            tag: area
            value: data_management
        title: A.7.3 Obtaining and choosing data
      a_7_4:
        text: a_7_4
        description: State what quality data must have, and see that the data used
          to build and run a system has it.
        annotations:
          area:
            tag: area
            value: data_management
        title: A.7.4 Data fit for purpose
      a_7_5:
        text: a_7_5
        description: Keep a process that records where data came from and what happened
          to it, while it and the system last.
        annotations:
          area:
            tag: area
            value: data_management
        title: A.7.5 Tracing where data came from
      a_7_6:
        text: a_7_6
        description: Set criteria for choosing how data is made ready, and name the
          methods to use.
        annotations:
          area:
            tag: area
            value: data_management
        title: A.7.6 Readying data
      a_8_2:
        text: a_8_2
        description: Work out what those who use a system need to know, and tell them.
        annotations:
          area:
            tag: area
            value: stakeholder_information
        title: A.8.2 What users are told
      a_8_3:
        text: a_8_3
        description: Give people outside the organization a way to report harm a system
          has done.
        annotations:
          area:
            tag: area
            value: stakeholder_information
        title: A.8.3 Letting outsiders report harm
      a_8_4:
        text: a_8_4
        description: Keep a plan for telling those who use a system when something
          goes wrong.
        annotations:
          area:
            tag: area
            value: stakeholder_information
        title: A.8.4 Telling users about incidents
      a_8_5:
        text: a_8_5
        description: Work out what the organization owes others by way of reports
          about a system.
        annotations:
          area:
            tag: area
            value: stakeholder_information
        title: A.8.5 Duties to inform others
      a_9_2:
        text: a_9_2
        description: Set down the processes for using AI systems responsibly.
        annotations:
          area:
            tag: area
            value: responsible_use
        title: A.9.2 Defined ways of using
      a_9_3:
        text: a_9_3
        description: Set goals that steer how AI systems are used responsibly.
        annotations:
          area:
            tag: area
            value: responsible_use
        title: A.9.3 Goals for use
      a_9_4:
        text: a_9_4
        description: See that a system is used only as intended and as its documents
          say.
        annotations:
          area:
            tag: area
            value: responsible_use
        title: A.9.4 Staying within documented use
      a_10_2:
        text: a_10_2
        description: Settle who carries which duty across a system's life, among the
          organization and those it deals with.
        annotations:
          area:
            tag: area
            value: external_relationships
        title: A.10.2 Sharing out duties
      a_10_3:
        text: a_10_3
        description: Keep a process that holds what suppliers provide to how the organization
          means to treat AI.
        annotations:
          area:
            tag: area
            value: external_relationships
        title: A.10.3 What is bought in
      a_10_4:
        text: a_10_4
        description: See that how the organization treats AI takes account of what
          its customers expect and want.
        annotations:
          area:
            tag: area
            value: external_relationships
        title: A.10.4 Buyers' needs
  AimsLifecycleStage:
    name: AimsLifecycleStage
    definition_uri: https://w3id.org/lmodel/iso42001/AimsLifecycleStage
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.6.1.3
    description: The eight stages of the generic life cycle model that ISO/IEC 22989:2022
      gives, which ISO/IEC 42001 points to.
    comments:
    - The standard lets an organization set its own stages, so a process can name
      its own model in aims_development_life_cycle_model.
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      inception:
        text: inception
        description: Someone sees a need, weighs whether to meet it, and sets goals.
      design_and_development:
        text: design_and_development
        description: The system is designed and built.
      verification_and_validation:
        text: verification_and_validation
        description: The system is checked against what was asked of it.
      deployment:
        text: deployment
        description: The system is put into service.
      operation_and_monitoring:
        text: operation_and_monitoring
        description: The system runs and is watched.
      continuous_validation:
        text: continuous_validation
        description: A system that goes on learning is checked again as it changes.
      re_evaluation:
        text: re_evaluation
        description: The system's results are weighed against its goals afresh.
      retirement:
        text: retirement
        description: The system is taken out of service.
  AimsAiRole:
    name: AimsAiRole
    definition_uri: https://w3id.org/lmodel/iso42001/AimsAiRole
    annotations:
      iso42001_clause:
        tag: iso42001_clause
        value: '4.1'
    description: The parts an organization or a person can play towards AI systems.
      The six families are those of ISO/IEC 22989:2022, and each more specific role
      names its family in an annotation.
    comments:
    - The standard says the list is open, so a part it does not name takes the family
      it falls under.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      ai_provider:
        text: ai_provider
        description: Offers AI systems or platforms to others.
      ai_platform_provider:
        text: ai_platform_provider
        description: Offers a platform that others build AI services on.
        annotations:
          role_family:
            tag: role_family
            value: ai_provider
      ai_product_or_service_provider:
        text: ai_product_or_service_provider
        description: Offers goods or services that hold an AI system.
        annotations:
          role_family:
            tag: role_family
            value: ai_provider
      ai_producer:
        text: ai_producer
        description: Makes AI systems.
      ai_developer:
        text: ai_developer
        description: Writes and trains what goes into a system.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_designer:
        text: ai_designer
        description: Decides how a system should work.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_operator:
        text: ai_operator
        description: Keeps a system running.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_tester_or_evaluator:
        text: ai_tester_or_evaluator
        description: Checks how well a system does.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_deployer:
        text: ai_deployer
        description: Puts a system into service.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_human_factor_professional:
        text: ai_human_factor_professional
        description: Looks after how people and a system work together.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      domain_expert:
        text: domain_expert
        description: Knows the field a system is used in.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_impact_assessor:
        text: ai_impact_assessor
        description: Weighs what a system may do to people and society.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      procurer:
        text: procurer
        description: Buys systems or their parts.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_governance_professional:
        text: ai_governance_professional
        description: Oversees how AI is run and held to account.
        annotations:
          role_family:
            tag: role_family
            value: ai_producer
      ai_customer:
        text: ai_customer
        description: Takes AI systems from a provider.
      ai_user:
        text: ai_user
        description: Works with a system directly.
        annotations:
          role_family:
            tag: role_family
            value: ai_customer
      ai_partner:
        text: ai_partner
        description: Helps others make or run AI systems.
      ai_system_integrator:
        text: ai_system_integrator
        description: Joins a system to others.
        annotations:
          role_family:
            tag: role_family
            value: ai_partner
      data_provider:
        text: data_provider
        description: Supplies data for a system.
        annotations:
          role_family:
            tag: role_family
            value: ai_partner
      ai_subject:
        text: ai_subject
        description: Is affected by what a system decides or does.
      data_subject:
        text: data_subject
        description: Is someone a system's data is about.
        annotations:
          role_family:
            tag: role_family
            value: ai_subject
      other_subject:
        text: other_subject
        description: Is affected in some other way.
        annotations:
          role_family:
            tag: role_family
            value: ai_subject
      relevant_authority:
        text: relevant_authority
        description: Sets or enforces rules for AI.
      policymaker:
        text: policymaker
        description: Sets the rules.
        annotations:
          role_family:
            tag: role_family
            value: relevant_authority
      regulator:
        text: regulator
        description: Enforces the rules.
        annotations:
          role_family:
            tag: role_family
            value: relevant_authority
  AimsPiiRole:
    name: AimsPiiRole
    definition_uri: https://w3id.org/lmodel/iso42001/AimsPiiRole
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.10.2
    description: The parts a party can play when personal data passes through AI,
      which ISO/IEC 29100 describes.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      pii_controller:
        text: pii_controller
        description: Decides why and how personal data is processed.
      joint_pii_controller:
        text: joint_pii_controller
        description: Makes those decisions together with another party.
      pii_processor:
        text: pii_processor
        description: Processes personal data on a controller's behalf.
  AimsObjectivePurpose:
    name: AimsObjectivePurpose
    definition_uri: https://w3id.org/lmodel/iso42001/AimsObjectivePurpose
    annotations:
      iso42001_clause:
        tag: iso42001_clause
        value: '6.2'
    description: What an AI objective is for. Clause 6.2 asks for objectives in general,
      and two Annex A controls ask for objectives of a narrower kind.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      organizational:
        text: organizational
        description: An objective for the whole system.
        annotations:
          iso42001_clause:
            tag: iso42001_clause
            value: '6.2'
      responsible_development:
        text: responsible_development
        description: A goal that steers how systems are built.
        annotations:
          annex_a_control:
            tag: annex_a_control
            value: A.6.1.2
      responsible_use:
        text: responsible_use
        description: A goal that steers how systems are used.
        annotations:
          annex_a_control:
            tag: annex_a_control
            value: A.9.3
  AimsObjectiveCategory:
    name: AimsObjectiveCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AimsObjectiveCategory
    annotations:
      annex_c_item:
        tag: annex_c_item
        value: C.2
    description: 'Kinds of objective an organization may set for AI: those Annex C
      lists, two more from the guidance on responsible use, and other.'
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      accountability:
        text: accountability
        description: Someone stays answerable for what a system helps to do.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.1
      ai_expertise:
        text: ai_expertise
        description: The organization has people with the skills AI calls for.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.2
      training_and_test_data:
        text: training_and_test_data
        description: Good data to train and check a system is to hand.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.3
      environmental_impact:
        text: environmental_impact
        description: A system's effect on the environment is kept in view.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.4
      fairness:
        text: fairness
        description: Automated decisions do not wrong particular persons or groups.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.5
      maintainability:
        text: maintainability
        description: Defects can be mended and new needs met.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.6
      privacy:
        text: privacy
        description: Data about people, sensitive data above all, is neither misused
          nor exposed.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.7
      robustness:
        text: robustness
        description: A system does as well on unseen data as on what it was trained
          on.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.8
      safety:
        text: safety
        description: Nobody's life or health, and no property or part of nature, comes
          to harm.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.9
      security:
        text: security
        description: Threats peculiar to AI are met, beyond the usual ones.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.10
      transparency_and_explainability:
        text: transparency_and_explainability
        description: Those concerned can see how a system works and why it gave a
          result.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.2.11
      reliability:
        text: reliability
        description: A system keeps doing what it is meant to.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.9.3
      accessibility:
        text: accessibility
        description: A system can be used by people with differing abilities.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.9.3
      other:
        text: other
        description: A kind of objective the organization sets for itself.
  AimsRiskSourceCategory:
    name: AimsRiskSourceCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AimsRiskSourceCategory
    annotations:
      annex_c_item:
        tag: annex_c_item
        value: C.3
    description: 'Kinds of source a risk from AI can come from: those Annex C lists,
      and other.'
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      complex_environment:
        text: complex_environment
        description: A system works where situations vary widely, so its results are
          less sure.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.1
      opaque_system:
        text: opaque_system
        description: The organization cannot tell people enough about a system.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.2
      level_of_automation:
        text: level_of_automation
        description: How much a system does alone, which bears on safety or fairness
          among others.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.3
      machine_learning:
        text: machine_learning
        description: The data a model learns from, or how it was gathered, is flawed.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.4
      hardware:
        text: hardware
        description: Faulty parts, or moving a trained model to other equipment.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.5
      life_cycle:
        text: life_cycle
        description: Flaws anywhere in a system's life, from design to retirement.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.6
      technology_readiness:
        text: technology_readiness
        description: A technology is too new to know well, or so old it breeds complacency.
        annotations:
          annex_c_item:
            tag: annex_c_item
            value: C.3.7
      other:
        text: other
        description: A source the organization names for itself.
  AimsImpactSubject:
    name: AimsImpactSubject
    definition_uri: https://w3id.org/lmodel/iso42001/AimsImpactSubject
    annotations:
      iso42001_clause:
        tag: iso42001_clause
        value: 6.1.4
    description: Who an AI system's impact falls on.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      individuals:
        text: individuals
        description: Particular persons.
      groups_of_individuals:
        text: groups_of_individuals
        description: Groups of persons, such as children or workers.
      societies:
        text: societies
        description: Society at large.
  AimsImpactArea:
    name: AimsImpactArea
    definition_uri: https://w3id.org/lmodel/iso42001/AimsImpactArea
    description: 'Areas where AI systems can touch people or society: those the guidance
      on impact assessment names as examples, and other.'
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      fairness:
        text: fairness
        description: Treating persons and groups even-handedly.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      accountability:
        text: accountability
        description: Someone staying answerable for the outcome.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      transparency_and_explainability:
        text: transparency_and_explainability
        description: Being able to see how a system works and why it gave a result.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      security_and_privacy:
        text: security_and_privacy
        description: Keeping people's information safe and private.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      safety_and_health:
        text: safety_and_health
        description: Physical and mental harm and wellbeing.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4, B.5.5
      financial:
        text: financial
        description: What people stand to gain or lose in money.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      accessibility:
        text: accessibility
        description: Whether people with differing abilities can use a system.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.4
      human_rights:
        text: human_rights
        description: Rights everyone holds.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.2, B.5.4
      environmental_sustainability:
        text: environmental_sustainability
        description: Natural resources and emissions.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.5
      economic:
        text: economic
        description: Jobs, access to finance, taxes and trade.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.5
      government:
        text: government
        description: Lawmaking, political falsehoods, defence of the state and the
          courts.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.5
      culture_and_values:
        text: culture_and_values
        description: What a society holds to, and the biases a system can feed.
        annotations:
          annex_b_item:
            tag: annex_b_item
            value: B.5.5
      other:
        text: other
        description: An area the organization names for itself.
  AimsImpactDirection:
    name: AimsImpactDirection
    definition_uri: https://w3id.org/lmodel/iso42001/AimsImpactDirection
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.5.3
    description: Whether an impact helps or harms.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      positive:
        text: positive
        description: It helps.
      negative:
        text: negative
        description: It harms.
  AimsResourceProvider:
    name: AimsResourceProvider
    definition_uri: https://w3id.org/lmodel/iso42001/AimsResourceProvider
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.4.2
    description: Who provides a resource an AI system draws on.
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      organization:
        text: organization
        description: The organization itself.
      customer:
        text: customer
        description: One of its customers.
      third_party:
        text: third_party
        description: Someone else.
  AimsDataCategory:
    name: AimsDataCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AimsDataCategory
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.4.3
    description: The parts data can play in machine learning.
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      training:
        text: training
        description: Data a model learns from.
      validation:
        text: validation
        description: Data used to tune a model and compare versions of it.
      test:
        text: test
        description: Data held back to see how a finished model does.
      production:
        text: production
        description: Data a system meets in service.
  AimsDataPreparationMethod:
    name: AimsDataPreparationMethod
    definition_uri: https://w3id.org/lmodel/iso42001/AimsDataPreparationMethod
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.7.6
    description: 'Common ways of making data ready for AI: those the guidance names,
      and other.'
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      statistical_exploration:
        text: statistical_exploration
        description: Looking at how the values are spread, and describing them.
      cleaning:
        text: cleaning
        description: Mending wrong values and dealing with gaps.
      imputation:
        text: imputation
        description: Filling gaps by a method.
      normalization:
        text: normalization
        description: Reshaping values to a common distribution or range.
      scaling:
        text: scaling
        description: Bringing values to comparable sizes.
      labelling:
        text: labelling
        description: Marking the values a model is to predict.
      encoding:
        text: encoding
        description: Turning categories into numbers.
      other:
        text: other
        description: A method the organization names for itself.
  AimsAiThreat:
    name: AimsAiThreat
    definition_uri: https://w3id.org/lmodel/iso42001/AimsAiThreat
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.6.2.3, B.6.2.6
    description: 'Threats to information security peculiar to AI: those the guidance
      names, and other.'
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      data_poisoning:
        text: data_poisoning
        description: Slipping bad data in to spoil what a model learns.
      model_stealing:
        text: model_stealing
        description: Copying a model by querying it or by taking it.
      model_inversion:
        text: model_inversion
        description: Working back from a model to the data it learned from.
      other:
        text: other
        description: A threat the organization names for itself.
  AimsImplementationStatus:
    name: AimsImplementationStatus
    definition_uri: https://w3id.org/lmodel/iso42001/AimsImplementationStatus
    description: How far a control or a plan has been put into effect.
    comments:
    - An Annex A control the organization leaves out has no implementation status;
      the Statement of Applicability records it as an AimsExcludedControl.
    in_subset:
    - aims_annex_a
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      not_started:
        text: not_started
        description: Nothing has been done yet.
      planned:
        text: planned
        description: The work is planned, with a timeline.
      in_progress:
        text: in_progress
        description: The work is under way.
      implemented:
        text: implemented
        description: The work is done and in operation.
  AimsRiskTreatmentOption:
    name: AimsRiskTreatmentOption
    definition_uri: https://w3id.org/lmodel/iso42001/AimsRiskTreatmentOption
    description: The ways of treating a risk, by the names ISO 31000 gives them.
    comments:
    - ISO/IEC 42001 asks an organization to choose options and names none, so these
      come from ISO 31000, as they do in lmodel/iso27001.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      modify:
        text: modify
        description: Change the risk with controls that lower its likelihood or its
          consequences.
        aliases:
        - mitigate
        - reduce
      retain:
        text: retain
        description: Keep the risk as it is, with management's approval.
        aliases:
        - accept
      avoid:
        text: avoid
        description: Remove the risk by stopping or changing what gives rise to it.
        aliases:
        - terminate
      share:
        text: share
        description: Share the risk with another party, such as an insurer or a supplier.
        aliases:
        - transfer
  AimsRiskLevel:
    name: AimsRiskLevel
    definition_uri: https://w3id.org/lmodel/iso42001/AimsRiskLevel
    description: A five-point scale of risk level, for an organization that adopts
      it. ISO/IEC 42001 leaves the scale to the organization.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      very_low:
        text: very_low
        description: Small enough to need no action.
      low:
        text: low
        description: Managed by routine procedures.
      medium:
        text: medium
        description: Needs management's attention and planned controls.
      high:
        text: high
        description: Needs treatment first and escalation.
      critical:
        text: critical
        description: Threatens the organization's objectives and needs action at once.
  AimsLikelihood:
    name: AimsLikelihood
    definition_uri: https://w3id.org/lmodel/iso42001/AimsLikelihood
    description: A five-point scale of likelihood, for an organization that adopts
      it. ISO/IEC 42001 leaves the scale to the organization.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      rare:
        text: rare
        description: Not expected to happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      unlikely:
        text: unlikely
        description: Could happen, but is not expected to.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      possible:
        text: possible
        description: Might happen at some point.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      likely:
        text: likely
        description: Will probably happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      almost_certain:
        text: almost_certain
        description: Expected to happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  AimsConsequence:
    name: AimsConsequence
    definition_uri: https://w3id.org/lmodel/iso42001/AimsConsequence
    description: A five-point scale of consequence, for an organization that adopts
      it. ISO/IEC 42001 leaves the scale to the organization.
    in_subset:
    - aims_risk_management
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      negligible:
        text: negligible
        description: No noticeable effect.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      minor:
        text: minor
        description: An effect normal operations absorb.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      moderate:
        text: moderate
        description: An effect that needs management to step in.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      major:
        text: major
        description: A serious effect on people, objectives or reputation.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      severe:
        text: severe
        description: An effect that threatens lives or the organization's survival.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  AimsDocumentKind:
    name: AimsDocumentKind
    definition_uri: https://w3id.org/lmodel/iso42001/AimsDocumentKind
    description: The kinds of documented information an AimsDocumentedInformation
      record holds. Policies have records of their own.
    in_subset:
    - aims_documented_information
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      procedure:
        text: procedure
        description: The steps for carrying out an activity the same way each time.
      standard:
        text: standard
        description: Mandatory requirements for a technology or a process.
      guideline:
        text: guideline
        description: Recommended practice that supports a policy or a procedure.
      record:
        text: record
        description: Evidence of what was done or achieved.
      plan:
        text: plan
        description: How the organization means to reach an objective.
      report:
        text: report
        description: The formal output of an assessment, audit or review.
  AimsAuditType:
    name: AimsAuditType
    definition_uri: https://w3id.org/lmodel/iso42001/AimsAuditType
    annotations:
      iso42001_clause:
        tag: iso42001_clause
        value: '9.2'
    description: Who carries out an audit, relative to the organization audited, as
      ISO 19011 sorts audits.
    in_subset:
    - aims_performance_evaluation
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      first_party:
        text: first_party
        description: The organization audits itself, or someone audits it on its behalf.
        aliases:
        - internal
      second_party:
        text: second_party
        description: A party with an interest in the organization audits it, such
          as a customer.
      third_party:
        text: third_party
        description: An independent body audits it, such as a certification body or
          a regulator.
  AimsAuditFindingType:
    name: AimsAuditFindingType
    definition_uri: https://w3id.org/lmodel/iso42001/AimsAuditFindingType
    description: The kinds of audit finding.
    in_subset:
    - aims_performance_evaluation
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      major_nonconformity:
        text: major_nonconformity
        description: A requirement not met in a way that puts the system's results
          in doubt.
      minor_nonconformity:
        text: minor_nonconformity
        description: A requirement not met in an isolated way that leaves its results
          in reach.
      observation:
        text: observation
        description: A condition that could lead to a nonconformity if left alone.
        aliases:
        - opportunity_for_improvement
      positive_finding:
        text: positive_finding
        description: Evidence of practice that works well.
  AimsIncidentCategory:
    name: AimsIncidentCategory
    definition_uri: https://w3id.org/lmodel/iso42001/AimsIncidentCategory
    annotations:
      annex_b_item:
        tag: annex_b_item
        value: B.8.4
    description: What an incident involving an AI system concerns. ISO/IEC 42001 tells
      apart an incident of the system itself from one about security of information
      or about privacy.
    in_subset:
    - aims_ai_systems
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      ai_system:
        text: ai_system
        description: The system itself misbehaved or failed.
      information_security:
        text: information_security
        description: Information was exposed, altered or made unavailable.
      privacy:
        text: privacy
        description: Personal data was exposed or misused.
      safety:
        text: safety
        description: Someone or something was put in danger.
      other:
        text: other
        description: Something the organization names for itself.
  AimsManagementSystemStandard:
    name: AimsManagementSystemStandard
    definition_uri: https://w3id.org/lmodel/iso42001/AimsManagementSystemStandard
    annotations:
      annex_d_item:
        tag: annex_d_item
        value: D.2
    description: Management system standards Annex D names as ones to run this system
      beside, and other.
    in_subset:
    - aims_core
    from_schema: https://w3id.org/lmodel/iso42001
    permissible_values:
      iso_iec_27001:
        text: iso_iec_27001
        description: Managing information security.
      iso_iec_27701:
        text: iso_iec_27701
        description: Managing privacy of information.
      iso_9001:
        text: iso_9001
        description: Managing quality.
      iso_22000:
        text: iso_22000
        description: Managing food safety.
      iso_13485:
        text: iso_13485
        description: Managing quality of medical devices.
      other:
        text: other
        description: Another management system standard, generic or for one sector.
slots:
  aims_id:
    name: aims_id
    definition_uri: https://w3id.org/lmodel/iso42001/aims_id
    description: The record's identifier, unique among the records of the system,
      such as a URI or a CURIE. Other records refer to the record by it.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_id
    identifier: true
    owner: AimsRecordMixin
    domain_of:
    - AimsRecordMixin
    range: uriorcurie
    required: true
  title:
    name: title
    definition_uri: https://w3id.org/lmodel/iso42001/title
    description: The name the organization gives the record.
    comments:
    - It means what LOKF's title means and carries the same IRI, so lokf adapt folds
      it into LOKF's slot and a knowledge bundle reads one title key.
    from_schema: https://w3id.org/lmodel/iso42001
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: AimsRecordMixin
    domain_of:
    - AimsRecordMixin
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/iso42001/description
    description: What the record says or describes, in the organization's own words.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/iso42001
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: AimsRecordMixin
    domain_of:
    - AimsRecordMixin
    range: string
  aims_resource_type:
    name: aims_resource_type
    definition_uri: https://w3id.org/lmodel/iso42001/aims_resource_type
    description: 'The kind of resource: AimsComponentResource, AimsDataResource, AimsToolingResource,
      AimsComputingResource or AimsHumanResource.'
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_resource_type
    designates_type: true
    owner: AimsSystemResource
    domain_of:
    - AimsSystemResource
    range: string
  aims_responsible_role:
    name: aims_responsible_role
    definition_uri: https://w3id.org/lmodel/iso42001/aims_responsible_role
    description: The role that answers for the record's activity or outcome.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_responsible_role
    owner: AimsImprovementOpportunity
    domain_of:
    - AimsObjective
    - AimsPlannedAction
    - AimsIncludedControl
    - AimsCommunication
    - AimsMonitoringItem
    - AimsCorrectiveAction
    - AimsImprovementOpportunity
    range: AimsRole
  aims_relevant_controls:
    name: aims_relevant_controls
    definition_uri: https://w3id.org/lmodel/iso42001/aims_relevant_controls
    description: The organization's controls that the record concerns.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_relevant_controls
    owner: AimsOperationalProcedure
    domain_of:
    - AimsTopicSpecificPolicy
    - AimsObjective
    - AimsControl
    - AimsAiSystem
    - AimsOperationalProcedure
    range: AimsControl
    multivalued: true
  aims_ai_systems:
    name: aims_ai_systems
    definition_uri: https://w3id.org/lmodel/iso42001/aims_ai_systems
    description: The AI systems the record concerns.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_ai_systems
    owner: AimsConcernReport
    domain_of:
    - AimsPlannedAction
    - AimsRiskAssessment
    - AimsRisk
    - AimsImpactAssessment
    - AimsApplicabilityEntry
    - AimsControl
    - AimsDevelopmentProcess
    - AimsResponsibleUseProcess
    - AimsTechnicalDocumentation
    - AimsUserInformation
    - AimsIncidentCommunicationPlan
    - AimsReportingObligation
    - AimsThirdPartyRelationship
    - AimsSystemEvent
    - AimsConcernReport
    range: AimsAiSystem
    multivalued: true
  aims_implementation_state:
    name: aims_implementation_state
    definition_uri: https://w3id.org/lmodel/iso42001/aims_implementation_state
    description: How far the control or the plan has been put into effect.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_implementation_state
    owner: AimsControl
    domain_of:
    - AimsRiskTreatmentPlan
    - AimsIncludedControl
    - AimsControl
    range: AimsImplementationStatus
  aims_cited_clauses:
    name: aims_cited_clauses
    definition_uri: https://w3id.org/lmodel/iso42001/aims_cited_clauses
    description: The clauses of the standard the record answers to or concerns.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_cited_clauses
    owner: AimsNonconformity
    domain_of:
    - AimsPolicy
    - AimsDocumentedInformation
    - AimsAuditFinding
    - AimsNonconformity
    range: AimsClause
    multivalued: true
  aims_cited_annex_a_controls:
    name: aims_cited_annex_a_controls
    definition_uri: https://w3id.org/lmodel/iso42001/aims_cited_annex_a_controls
    description: The controls of Annex A the record answers to or concerns.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_cited_annex_a_controls
    owner: AimsNonconformity
    domain_of:
    - AimsPolicy
    - AimsTopicSpecificPolicy
    - AimsControl
    - AimsDocumentedInformation
    - AimsOperationalProcedure
    - AimsAuditFinding
    - AimsNonconformity
    range: AimsAnnexAControl
    multivalued: true
  aims_life_cycle_stages:
    name: aims_life_cycle_stages
    definition_uri: https://w3id.org/lmodel/iso42001/aims_life_cycle_stages
    description: The stages of an AI system's life the record applies to.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_life_cycle_stages
    owner: AimsThirdPartyRelationship
    domain_of:
    - AimsSystemResource
    - AimsThirdPartyRelationship
    range: AimsLifecycleStage
    multivalued: true
  aims_entry_annex_a_control:
    name: aims_entry_annex_a_control
    definition_uri: https://w3id.org/lmodel/iso42001/aims_entry_annex_a_control
    description: The Annex A control a Statement of Applicability entry concerns.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_entry_annex_a_control
    owner: AimsApplicabilityEntry
    domain_of:
    - AimsApplicabilityEntry
    range: AimsAnnexAControl
  aims_objective_categories:
    name: aims_objective_categories
    definition_uri: https://w3id.org/lmodel/iso42001/aims_objective_categories
    description: The kinds of objective the record bears on.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_objective_categories
    owner: AimsControl
    domain_of:
    - AimsObjective
    - AimsControl
    range: AimsObjectiveCategory
    multivalued: true
  aims_risk_source_categories:
    name: aims_risk_source_categories
    definition_uri: https://w3id.org/lmodel/iso42001/aims_risk_source_categories
    description: The kinds of risk source the record bears on.
    from_schema: https://w3id.org/lmodel/iso42001
    slot_uri: iso42001:aims_risk_source_categories
    owner: AimsControl
    domain_of:
    - AimsRisk
    - AimsControl
