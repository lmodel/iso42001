name: iso42001
annotations:
  standard:
    tag: standard
    value: ISO/IEC 42001:2023
  edition:
    tag: edition
    value: '1'
  publication_date:
    tag: publication_date
    value: '2023-12-18'
  normative_reference:
    tag: normative_reference
    value: ISO/IEC 22989:2022
  iso_open_data_date:
    tag: iso_open_data_date
    value: '2026-11-05'
description: A LinkML model of the records an organization keeps to run an artificial
  intelligence (AI) management system under ISO/IEC 42001:2023. The records cover
  its context, leadership, planning and support, how it weighs and treats AI risks,
  and what its AI systems may do to people and society. They also cover those systems
  with their resources, data and documents, its audits and reviews, and what it corrects
  and improves. The reference controls of Annex A appear by number, with titles of
  this project's own.
title: ISO/IEC 42001:2023 AI management system records
comments:
- The version is the edition the schema models, and source is ISO's page for it. ISO
  Open Data's records of the edition and of its normative reference are copied to
  src/iso42001/schema/iso-open-data/ on the date the annotations give, and scripts/check_upstream_release.py
  reports when ISO changes them. The release tags are the schema's own versions.
- ISO/IEC 42001 is copyright ISO and IEC, and none of its text is reproduced here.
  An element cites what it models by number, in the iso42001_clause, annex_a_control,
  annex_b_item, annex_c_item or annex_d_item annotation, and its title and description
  are this project's own words. A reader with a licensed copy looks the text up by
  that number, and a record's title and description hold the organization's own words.
- The terms follow ISO/IEC 22989:2022, the one normative reference, and so do the
  stages of a system's life and the kinds of AI role. Annexes C and D are informative
  and give examples, so an enum built from one of them has the value other.
- Every record that other records refer to has an aims_id, and a reference holds that
  identifier. AimsManagementSystem holds each kind of record in a list of its own.
- 'A close mapping to lmodel/iso27001 names the class that answers to the same clause
  number, since both standards follow the harmonized structure of management system
  standards. AimsOrganization and AimsRole are the same kind of thing as SPDX''s Organization
  and OSCAL''s Role. AimsControl is related to OSCAL''s Control: both name a safeguard,
  but OSCAL''s is a catalogue entry and this one is the organization''s own.'
source: https://www.iso.org/standard/81230.html
see_also:
- https://lmodel.github.io/iso42001
- https://www.iso.org/standard/81230.html
- https://www.iso.org/standard/74296.html
