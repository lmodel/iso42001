      a_8_4:
        text: a_8_4
        description: Communication of incidents - document a plan for communicating
          incidents to users.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.8.4
          control_family:
            tag: control_family
            value: A.8
      a_8_5:
        text: a_8_5
        description: Information for interested parties - document obligations to
          report AI system information to interested parties.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.8.5
          control_family:
            tag: control_family
            value: A.8
      a_9_2:
        text: a_9_2
        description: Processes for responsible use of AI systems - define and document
          responsible use processes.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.9.2
          control_family:
            tag: control_family
            value: A.9
      a_9_3:
        text: a_9_3
        description: Objectives for responsible use of AI system - identify and document
          responsible-use objectives.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.9.3
          control_family:
            tag: control_family
            value: A.9
      a_9_4:
        text: a_9_4
        description: Intended use of the AI system - ensure use aligns with the documented
          intended use.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.9.4
          control_family:
            tag: control_family
            value: A.9
      a_10_2:
        text: a_10_2
        description: Allocating responsibilities - allocate AI lifecycle responsibilities
          across organization, partners, suppliers, customers, third parties.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.10.2
          control_family:
            tag: control_family
            value: A.10
      a_10_3:
        text: a_10_3
        description: Suppliers - ensure supplier-provided services, products, and
          materials align with the organization's responsible AI approach.
        annotations:
          annex_a_id:
