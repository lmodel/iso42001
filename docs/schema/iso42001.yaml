classes:
  AimsRecordMixin:
    name: AimsRecordMixin
    definition_uri: https://w3id.org/lmodel/iso42001/AimsRecordMixin
    description: 'What every record of the system has, so that other records can refer
      to it: an identifier, a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record
      classes on LOKF's Concept and leave the others as they are. lokf adapt replaces
      aims_id with LOKF's id, and a class that declares id itself must descend from
      Concept.
    from_schema: https://w3id.org/lmodel/iso42001
    mixin: true
    slots:
    - aims_id
    - AimsRecordMixin_title
    - description
    slot_usage:
      title:
        name: title
        required: true
        pattern: ^\s*\S
    class_uri: iso42001:AimsRecordMixin
  AimsDocumentControlMixin:
    name: AimsDocumentControlMixin
    definition_uri: https://w3id.org/lmodel/iso42001/AimsDocumentControlMixin
    annotations:
      iso42001_clause:
        tag: iso42001_clause
        value: '7.5'
    description: 'The control that documented information is kept under: who wrote,
      owns and approved it, its format and medium, when it takes effect and is looked
      at again, how it is classified, handed out, stored and changed, how long it
      is kept, and whether it came from outside.'
    in_subset:
    - aims_documented_information
    from_schema: https://w3id.org/lmodel/iso42001
    mixin: true
    slots:
    - aimsDocumentControlMixin__aims_document_reference
    - aimsDocumentControlMixin__aims_document_version
    - aimsDocumentControlMixin__aims_document_author
    - aimsDocumentControlMixin__aims_document_owner
    - aimsDocumentControlMixin__aims_document_format
    - aimsDocumentControlMixin__aims_document_medium
    - aimsDocumentControlMixin__aims_document_approver
    - aimsDocumentControlMixin__aims_document_approval_date
