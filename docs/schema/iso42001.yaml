name: iso42001
annotations:
  standard_reference:
    tag: standard_reference
    value: ISO/IEC 42001:2023(E)
  standard_title:
    tag: standard_title
    value: Information technology - Artificial intelligence - Management system
  standard_edition:
    tag: standard_edition
    value: First edition
  standard_date:
    tag: standard_date
    value: 2023-12
  developing_committee:
    tag: developing_committee
    value: ISO/IEC JTC 1/SC 42 (Artificial Intelligence)
  normative_reference:
    tag: normative_reference
    value: ISO/IEC 22989:2022 (AI concepts and terminology)
  related_standards:
    tag: related_standards
    value: ISO/IEC 23894 (AI risk management guidance); ISO/IEC 38507 (Governance
      of IT - AI governance implications); ISO/IEC 5259 (Data quality for analytics
      and ML); ISO/IEC 5338 (AI system life cycle process); ISO/IEC 27001 (Information
      security management); ISO/IEC 27701 (Privacy information management); ISO 9001
      (Quality management); ISO 31000 (Risk management)
  harmonized_structure:
    tag: harmonized_structure
    value: true
  rights_notice:
    tag: rights_notice
    value: This project is licensed under Apache-2.0 for original schema structure
      and descriptions. ISO/IEC standards text is owned by ISO/IEC and is not reproduced
      verbatim by this project.
  schema_maintainer:
    tag: schema_maintainer
    value: noel.mcloughlin@gmail.com
  schema_status:
    tag: schema_status
    value: stable
  amendment_reference:
    tag: amendment_reference
    value: Forward-compatibility placeholder for tracking amendments (AMD) and technical
      corrigenda (Cor) to ISO/IEC 42001:2023. Update when ISO/IEC publishes amendments
      to the base edition.
description: 'A comprehensive LinkML schema modeling AI Management System (AIMS) entities,
  workflows, and traceability links aligned to ISO/IEC 42001:2023 clause and Annex
  references. Designed for open data publication, automated validation, and integration
  with AI governance, risk, and compliance platforms.

  This schema captures: - AIMS lifecycle (establish, implement, maintain, improve)
  - AI risk assessment, treatment, and AI system impact assessment (Clause 6.1) -
  Annex A reference control catalog (A.2-A.10) for responsible AI - Audit, measurement,
  and continual improvement artifacts - Data resources, tooling, computing, and human
  resources for AI systems - Third-party, supplier, and customer relationships across
  the AI life cycle'
title: 'ISO 42001 / AIMS: LinkML Schema'
see_also:
- https://lmodel.github.io/iso42001
- https://www.iso.org/standard/81230.html
id: https://w3id.org/lmodel/iso42001
version: 1.0.0
imports:
- linkml:types
license: https://www.apache.org/licenses/LICENSE-2.0
