            value: A.7
      a_8_2:
        text: a_8_2
        description: System documentation and information for users - provide information
          needed by AI system users.
        annotations:
          annex_a_id:
            tag: annex_a_id
            value: A.8.2
          control_family:
            tag: control_family
            value: A.8
      a_8_3:
        text: a_8_3
        description: External reporting - enable interested parties to report adverse
