    aims_planned_action_risks:
      - acme:risk-age-bias
    aims_planned_action_opportunities:
      - Earlier triage for older patients
    aims_planned_action_integration: It runs as a gate in the release process.
    aims_planned_action_effectiveness: The gap falls quarter on quarter.
aims_risk_assessment_process:
  aims_id: acme:process-risk
  title: AI risk assessment process
  aims_risk_criteria:
    - A risk rated high or above is not acceptable untreated
  aims_risk_policy_alignment: Criteria follow the AI policy and the objectives.
  aims_risk_comparability: One scale, one template and one reviewer panel.
  aims_risk_method: Workshop with clinical and technical staff
  aims_risk_likelihood_scale: Five points, rare to almost certain
  aims_risk_consequence_scale: Five points, negligible to severe
  aims_risk_prioritization: Highest level first, then earliest deadline
  aims_risk_assessment_interval: P6M
  aims_risk_assessment_triggers:
    - A new model version
    - A new customer group
aims_risk_treatment_process:
  aims_id: acme:process-treatment
  title: AI risk treatment process
  aims_treatment_options_guidance: Modify where a control can bring the risk under the line.
  aims_treatment_control_selection: Start from the failure the risk describes.
  aims_treatment_annex_a_comparison: Each treatment is checked against the Annex A list.
  aims_treatment_additional_controls: We add our own where the list has no match.
  aims_treatment_annex_b_use: The control owner reads the matching guidance.
  aims_treatment_soa_template: SOA-TEMPLATE-02
  aims_treatment_approval_workflow: The executive team signs each plan.
aims_impact_assessment_process:
  aims_id: acme:process-impact
  title: AI system impact assessment process
  aims_impact_process_triggers:
    - A new intended use
    - A change in how much the tool does alone
  aims_impact_process_interval: P1Y
  aims_impact_process_steps:
    - Find
    - Analyse
    - Evaluate
    - Treat
    - Report
  aims_impact_process_assessors: A clinician and a data scientist
  aims_impact_process_use: Results feed the risk register and the release gate.
  aims_impact_process_subjects:
    - individuals
    - groups_of_individuals
    - societies
  aims_impact_process_areas:
    - fairness
    - safety_and_health
  aims_impact_process_retention: P10Y
