# Runs of words scripts/check_overlap.py lets through, each with its reason.
# A run is matched after the script's own normalization: lower case, no
# punctuation, and a dotted number such as A.6.1.2 as one word.
- run: ISO/IEC 42001:2023
  reason: The standard's own reference.
- run: ISO/IEC 22989:2022
  reason: The reference the standard itself cites by this name.
- run: Information technology Artificial intelligence Management system
  reason: The standard's own title, which NOTICE cites.
- run: Statement of Applicability
  reason: A term the standard defines, used as its name.
